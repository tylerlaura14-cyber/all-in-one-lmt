<title>My Hub</title>
<meta name="claude:viewport-fit-sides" content="cover">
<script src="vendor/hub/jspdf.umd.min.js"></script>

<style>
:root{--hub-bg:var(--aio-bg,#f4f4f4)!important;--hub-card:var(--aio-card,#ffffff)!important;--hub-fg:var(--aio-text,#161616)!important;--hub-muted:var(--aio-muted,#666666)!important;--hub-line:var(--aio-line,#dadada)!important;--hub-accent:var(--aio-btn,#1f1f1f)!important;--hub-on-accent:var(--aio-on-btn,#ffffff)!important}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--hub-bg:var(--aio-bg,#000000)!important;--hub-card:var(--aio-card,#141414)!important;--hub-fg:var(--aio-text,#eeeeee)!important;--hub-muted:var(--aio-muted,#a8a8a8)!important;--hub-line:var(--aio-line,#2e2e2e)!important;--hub-accent:var(--aio-btn,#e6e6e6)!important;--hub-on-accent:var(--aio-on-btn,#111111)!important}}
:root[data-theme="dark"]{--hub-bg:var(--aio-bg,#000000)!important;--hub-card:var(--aio-card,#141414)!important;--hub-fg:var(--aio-text,#eeeeee)!important;--hub-muted:var(--aio-muted,#a8a8a8)!important;--hub-line:var(--aio-line,#2e2e2e)!important;--hub-accent:var(--aio-btn,#e6e6e6)!important;--hub-on-accent:var(--aio-on-btn,#111111)!important}
html{background:var(--hub-bg)!important}body{background:transparent!important;min-height:100vh}</style>
<style>
  /* Layout: a slim tab bar on top; each app fills the page under it, the settings page is one narrow column. */
  :root {
    --hub-bg: #f4f4f4; --hub-card: #ffffff; --hub-fg: #161616; --hub-muted: #666666; --hub-line: #dadada;
    --hub-accent: #1f1f1f; --hub-on-accent: #ffffff; --hub-good: #1d8a52; --hub-bad: #c4372f;
    --hub-font: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
    --hub-display: var(--hub-font);
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
    --hub-bg: #0e0e0e; --hub-card: #1a1a1a; --hub-fg: #eeeeee; --hub-muted: #a8a8a8; --hub-line: #333333;
    --hub-accent: #e6e6e6; --hub-on-accent: #111111; --hub-good: #45c085; --hub-bad: #ef6a61; color-scheme: dark } }
  :root[data-theme="dark"] {
    --hub-bg: #0e0e0e; --hub-card: #1a1a1a; --hub-fg: #eeeeee; --hub-muted: #a8a8a8; --hub-line: #333333;
    --hub-accent: #e6e6e6; --hub-on-accent: #111111; --hub-good: #45c085; --hub-bad: #ef6a61; color-scheme: dark }
  [hidden] { display: none !important; }
  /* Background pictures: same faintness as the medical side's (hub-web.js copies its on/off and strength) */
  #hub-watermark { position: fixed; inset: 0; z-index: -1; pointer-events: none; overflow: hidden; user-select: none;
    color: var(--aio-text, var(--hub-fg)); opacity: var(--aio-watermark, .035); }
  :root[data-theme="dark"] #hub-watermark { opacity: var(--aio-watermark, .055); }
  body { background: var(--hub-bg); color: var(--hub-fg); font-family: var(--hub-font); }
  .hub-bar { background: var(--hub-card); border-bottom: 1px solid var(--hub-line);
    padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px)); padding-block: 8px; }
  .hub-tabs { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; max-width: 1120px; margin: 0 auto; }
  .hub-tabs::-webkit-scrollbar { display: none; }
  .hub-tabs button { flex: 1 0 auto; font: 600 14px/1.2 var(--hub-font); color: var(--hub-muted); background: none;
    border: 1px solid transparent; border-radius: 9px; padding: 9px 10px; cursor: pointer; white-space: nowrap;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
  .hub-tabs button:hover { color: var(--hub-fg); background: var(--hub-bg); }
  .hub-tabs button[aria-selected="true"] { color: var(--hub-on-accent); background: var(--hub-accent); }
  .hub-tabs button:focus-visible, .hub-btn:focus-visible { outline: 2px solid var(--hub-accent); outline-offset: 2px; }
  #hub-apps { position: relative; }
  .hub-app { display: block; }
  .hub-app:not(.on) { position: absolute; top: 0; left: 0; width: 100%; height: 0; overflow: hidden; visibility: hidden; }
  .hub-crash { padding: 24px 16px; color: var(--hub-bad); }

  .hub-page { max-width: 680px; margin: 0 auto; padding-block: 24px 64px;
    padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
    display: flex; flex-direction: column; gap: 20px; }
  .hub-page h1 { font: 700 26px/1.15 var(--hub-display); margin: 0; text-wrap: balance; }
  .hub-page h2 { font: 700 17px/1.2 var(--hub-display); margin: 0; }
  .hub-page p { margin: 0; line-height: 1.5; max-width: 62ch; }
  .hub-muted { color: var(--hub-muted); font-size: 14px; }
  .hub-card { background: var(--hub-card); border: 1px solid var(--hub-line); border-radius: 12px; padding: 18px;
    display: flex; flex-direction: column; gap: 12px; }
  .hub-btn { font: 600 14px/1 var(--hub-font); border-radius: 9px; padding: 11px 16px; cursor: pointer;
    border: 1px solid var(--hub-line); background: var(--hub-bg); color: var(--hub-fg); }
  .hub-btn.primary { background: var(--hub-accent); border-color: var(--hub-accent); color: var(--hub-on-accent); }
  .hub-btn:disabled { opacity: .5; cursor: default; }
  .hub-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .hub-files { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
  .hub-files li { border: 1px solid var(--hub-line); border-radius: 10px; padding: 10px 12px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .hub-files b { overflow-wrap: anywhere; }
  .hub-files .ok { color: var(--hub-good); font-size: 14px; }
  .hub-files .bad { color: var(--hub-bad); font-size: 14px; }
  .hub-files .note { color: var(--hub-muted); font-size: 13px; }
  .hub-confirm { border: 1px solid var(--hub-accent); border-radius: 10px; padding: 12px; display: flex; flex-direction: column; gap: 10px; }
  .hub-log { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 6px; font-size: 14px; }
  .hub-log .bad { color: var(--hub-bad); }
  .hub-log .ok { color: var(--hub-good); }
  .hub-card p:empty, .hub-files:empty { display: none; }
  .hub-left { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 8px; }
  .hub-left label { border: 1px solid var(--hub-line); border-radius: 10px; padding: 6px; display: flex; flex-direction: column; gap: 4px; font-size: 12px; cursor: pointer; min-width: 0; position: relative; }
  .hub-left img, .hub-left .doc { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 6px; background: var(--hub-bg); display: flex; align-items: center; justify-content: center; font-size: 13px; color: var(--hub-muted); overflow: hidden; }
  .hub-left input { position: absolute; top: 10px; left: 10px; width: 20px; height: 20px; }
  .hub-left span { color: var(--hub-muted); overflow-wrap: anywhere; }
  .hub-apps-list { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 4px; font-size: 14px; }
  .hub-toast { position: fixed; z-index: 50; left: 50%; transform: translateX(-50%); width: min(520px, calc(100% - 32px));
    bottom: calc(16px + env(safe-area-inset-bottom, 0px)); background: var(--hub-fg); color: var(--hub-bg);
    border-radius: 12px; padding: 12px 14px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    box-shadow: 0 6px 24px rgb(0 0 0 / .25); font-size: 15px; }
  .hub-toast span { flex: 1 1 200px; min-width: 0; overflow-wrap: anywhere; }
  .hub-toast .hub-btn { padding: 8px 12px; }
  /* Insights tab */
  .ins-week { display: flex; align-items: center; gap: 8px; }
  .ins-week > div { flex: 1; text-align: center; }
  .ins-week small { display: block; font-size: 13px; color: var(--hub-muted); margin-top: 2px; }
  .ins-week .hub-btn { width: 44px; padding: 9px 0; font-size: 18px; }
  .ins-days { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
  .ins-day { border: 1px solid var(--hub-line); border-radius: 10px; padding: 6px 2px; display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 12px; min-height: 104px; }
  .ins-day.today { border-color: var(--hub-fg); }
  .ins-day .dn { color: var(--hub-muted); font-weight: 600; }
  .ins-day .mood { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; color: #fff; background: var(--hub-line); font-size: 13px; }
  .ins-day .mood.none { background: none; border: 1px dashed var(--hub-line); color: var(--hub-muted); }
  .ins-day .ic { line-height: 1.2; text-align: center; min-height: 15px; }
  .ins-key { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 13px; color: var(--hub-muted); }
  .ins-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  .ins-stat:first-child { grid-column: 1 / -1; }
  .ins-stat { border: 1px solid var(--hub-line); border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 4px; min-width: 0; position: relative; }
  .ins-stat .ins-go { position: absolute; top: 8px; right: 8px; width: 30px; height: 30px; padding: 0; border-radius: 8px; font-size: 15px; line-height: 1;
    display: grid; place-items: center; }
  .ins-stat:has(.ins-go) .lbl { padding-right: 34px; }
  .ins-stat .lbl { font-size: 13px; font-weight: 600; }
  .ins-stat .big { font-size: 24px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.1; }
  .ins-stat .sub { font-size: 13px; color: var(--hub-muted); }
  .ins-up { color: var(--hub-good); } .ins-down { color: var(--hub-bad); }
  .ins-link { display: flex; flex-direction: column; gap: 6px; padding-top: 12px; border-top: 1px solid var(--hub-line); }
  .ins-link:first-of-type { border-top: 0; padding-top: 0; }
  .ins-link .q { font-weight: 600; }
  .ins-bar { display: grid; grid-template-columns: 112px minmax(0, 1fr) 36px; gap: 8px; align-items: center; font-size: 13px; }
  .ins-bar .track, .ins-bar .fill { display: block; }
  .ins-bar .track { height: 10px; border-radius: 99px; background: var(--hub-bg); border: 1px solid var(--hub-line); overflow: hidden; }
  .ins-bar .fill { height: 100%; border-radius: 99px; background: var(--hub-accent); }
  .ins-bar .fill.b { opacity: .45; }
  .ins-bar b { text-align: right; font-variant-numeric: tabular-nums; }
  .ins-link .ans { font-size: 14px; }
  @media (max-width: 380px) { .ins-bar { grid-template-columns: 92px minmax(0, 1fr) 32px; } .ins-day { font-size: 11px; } }
  .hub-seg { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; padding: 4px; border-radius: 12px; background: var(--hub-bg); border: 1px solid var(--hub-line); }
  .hub-seg.five { grid-template-columns: repeat(5, minmax(0, 1fr)); }
  .hub-seg.five button { font-size: 12px; padding: 8px 0; line-height: 1.3; white-space: nowrap; }
  .hub-seg.two { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .hub-seg.five button .em { display: block; font-size: 16px; }
  @media (max-width: 360px) { .hub-seg.five button { font-size: 10.5px; } }
  .hub-seg button { font: 600 14px/1.2 var(--hub-font); padding: 11px 6px; border: 0; border-radius: 9px; background: none; color: var(--hub-muted); cursor: pointer; }
  .hub-seg button[aria-checked="true"] { background: var(--hub-accent); color: var(--hub-on-accent); }
  .hub-seg button:focus-visible { outline: 2px solid var(--hub-accent); outline-offset: 2px; }

  /* (z-index kept low on purpose: the apps' own pop-ups (Mind's viewer and settings, Workout's dialogs) use 20-30 and must cover the menu) */
  /* Tabs down the left side, like the medical side: a fixed side menu on wide screens,
     a slide-out menu (opened with the ☰ button) on phones */
  .hub-mbar { display: none; }
  .hub-bar { position: fixed; top: 0; bottom: 0; left: 0; width: 240px; box-sizing: border-box; z-index: 12; overflow-y: auto; overflow-x: hidden;
    border-bottom: 0; border-right: 1px solid var(--hub-line); padding: 16px 12px; padding-left: max(12px, env(safe-area-inset-left, 0px)); }
  .hub-side-label { font: 700 11px/1 var(--hub-font); letter-spacing: .08em; text-transform: uppercase; color: var(--hub-muted); padding: 4px 10px 10px; }
  .hub-tabs { flex-direction: column; overflow: visible; max-width: none; margin: 0; gap: 4px; }
  .hub-tabs button { flex: 0 0 auto; width: 100%; box-sizing: border-box; justify-content: flex-start; padding: 10px 12px; text-align: left; }
  body { padding-left: 240px; }
  .hub-scrim { display: none; }
  /* ☰ in All in One's header folds the side menu away on wider screens (remembered on this device) */
  @media (min-width: 768px) { body.hub-collapsed .hub-bar { display: none; } body.hub-collapsed { padding-left: 0; } }
  /* Phones: the ☰ in All in One's header opens this menu, so this bar only shows the open tab's name */
  .hub-mbar button { display: none !important; }
  @media (max-width: 767px) {
    body { padding-left: 0; }
    .hub-mbar { display: flex; align-items: center; gap: 10px; position: sticky; top: 0; z-index: 10; background: var(--hub-card);
      border-bottom: 1px solid var(--hub-line); padding: 8px 12px; padding-left: max(12px, env(safe-area-inset-left, 0px)); }
    .hub-mbar button { display: inline-flex; align-items: center; justify-content: center; width: 40px; height: 40px; border-radius: 10px;
      border: 1px solid var(--hub-line); background: var(--hub-bg); color: var(--hub-fg); font-size: 20px; cursor: pointer; }
    .hub-mbar b { font: 700 16px/1.2 var(--hub-font); }
    .hub-bar { width: min(288px, 85vw); transform: translateX(-100%); transition: transform .2s ease; box-shadow: none; }
    body.hub-menu-open .hub-bar { transform: none; box-shadow: 0 10px 40px rgba(0,0,0,.35); z-index: 1001; }
    body.hub-menu-open .hub-scrim { display: block; position: fixed; inset: 0; z-index: 1000; background: rgba(0,0,0,.45); }
  }
  @media (max-width: 767px) and (prefers-reduced-motion: reduce) { .hub-bar { transition: none; } }
</style>

<!-- Faint pencils, journals and weights behind everything, like the medical side's bandages (its on/off and strength setting applies here too) -->

    <defs>
      <pattern id="hub-bg-pattern" width="280" height="280" patternUnits="userSpaceOnUse">

        <g transform="translate(55, 55) rotate(-35)" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round">
          <rect x="-34" y="-7" width="54" height="14" rx="2" />
          <rect x="-44" y="-7" width="10" height="14" rx="3" fill="currentColor" fill-opacity="0.25" />
          <line x1="-34" y1="-7" x2="-34" y2="7" />
          <path d="M20 -7 L38 0 L20 7 Z" />

          <line x1="-30" y1="0" x2="16" y2="0" stroke-width="1.5" />

        <g transform="translate(195, 60) rotate(8)" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round">

          <line x1="-14" y1="-28" x2="-14" y2="28" />
          <rect x="-6" y="-12" width="22" height="10" rx="2" fill="currentColor" fill-opacity="0.25" stroke-width="1.5" />
          <line x1="12" y1="-28" x2="12" y2="28" stroke-width="1.8" />
          <circle cx="-22" cy="-18" r="2" fill="currentColor" /><circle cx="-22" cy="-6" r="2" fill="currentColor" />
          <circle cx="-22" cy="6" r="2" fill="currentColor" /><circle cx="-22" cy="18" r="2" fill="currentColor" />

          <rect x="-36" y="-14" width="10" height="28" rx="3" fill="currentColor" fill-opacity="0.25" />
          <rect x="-26" y="-10" width="7" height="20" rx="2" />

        <!-- Open journal -->
        <g transform="translate(55, 205) rotate(-10)" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linejoin="round">

          <line x1="-24" y1="-8" x2="-8" y2="-6" stroke-width="1.5" /><line x1="-24" y1="0" x2="-8" y2="2" stroke-width="1.5" />
          <line x1="8" y1="-6" x2="24" y2="-8" stroke-width="1.5" /><line x1="8" y1="2" x2="24" y2="0" stroke-width="1.5" />
        </g>
        <!-- Kettlebell -->
        <g transform="translate(225, 205)" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round">
          <path d="M-9 -12 V-18 a9 9 0 0 1 18 0 V-12" />
          <path d="M-14 -10 H14 C22 -4 24 6 20 14 C17 20 10 22 0 22 C-10 22 -17 20 -20 14 C-24 6 -22 -4 -14 -10 Z" fill="currentColor" fill-opacity="0.25" />

    <rect width="100%" height="100%" fill="url(#hub-bg-pattern)" />

</div>
<!-- Phones: menu button + the open tab's name (the tabs are in the slide-out menu) -->
<div class="hub-mbar">
  <button type="button" id="hub-menu-btn" aria-label="Open menu" aria-controls="hub-side" aria-expanded="false">☰</button>
  <b id="hub-current"></b>
</div>
<div class="hub-scrim" id="hub-scrim"></div>
<header class="hub-bar" id="hub-side">
  <div class="hub-side-label">My Hub</div>
  <nav class="hub-tabs" id="hub-tabs" role="tablist" aria-label="Apps" aria-orientation="vertical">
    <button type="button" role="tab" id="tab-mind" data-tab="mind">🧠 Mind</button>
    <button type="button" role="tab" id="tab-workout" data-tab="workout">💪 Workout</button>
    <button type="button" role="tab" id="tab-money" data-tab="money">💵 Money</button>
    <button type="button" role="tab" id="tab-insights" data-tab="insights">📊 Insights</button>
  </nav>
</header>

<div id="hub-apps">
  <div class="hub-app" id="app-mind" role="tabpanel" aria-labelledby="tab-mind"></div>
  <div class="hub-app" id="app-workout" role="tabpanel" aria-labelledby="tab-workout"></div>
  <div class="hub-app" id="app-fresh" role="tabpanel" aria-labelledby="tab-fresh"></div>
  <div class="hub-app" id="app-money" role="tabpanel" aria-labelledby="tab-money"></div>
  <section class="hub-app" id="app-insights" role="tabpanel" aria-labelledby="tab-insights">
    <div class="hub-page">
      <div>
        <h1>Insights</h1>
        <p class="hub-muted" style="margin-top:6px">Your week in Mind Tracker and Workout, and how they connect.</p>
      </div>
      <section class="hub-card" aria-labelledby="ins-week-h">
        <div class="ins-week">
          <button type="button" class="hub-btn" id="ins-prev" aria-label="Last week">‹</button>
          <div><h2 id="ins-week-h">This week</h2><small id="ins-week-d"></small></div>
          <button type="button" class="hub-btn" id="ins-next" aria-label="Next week">›</button>
        </div>
        <div class="ins-days" id="ins-days"></div>
        <div class="ins-key"><span>Circle = mood (1–10)</span><span>💪 worked out</span></div>
      </section>
      <section class="hub-card" aria-labelledby="ins-rep-h">
        <h2 id="ins-rep-h">Weekly report</h2>
        <div class="ins-grid" id="ins-report"></div>
        <p class="hub-muted" id="ins-status" role="status"></p>
      </section>
      <section class="hub-card" aria-labelledby="ins-links-h">
        <div>
          <h2 id="ins-links-h">How workouts affect your mood</h2>
          <p class="hub-muted" style="margin-top:4px">Your average mood on different kinds of days, from the last 90 days.</p>
        </div>
        <div id="ins-links" style="display:flex;flex-direction:column;gap:12px"></div>
      </section>
    </div>
  </section>
</div>

<div class="hub-toast" id="hub-toast" role="alert" hidden>
  <span id="hub-toast-msg"></span>
  <button type="button" class="hub-btn primary" id="hub-toast-open">Open</button>
  <button type="button" class="hub-btn" id="hub-toast-close" aria-label="Close">✕</button>
</div>

<script>
const HUB = (() => {
  const LABELS = { mind: "Mind Tracker", workout: "Workout Tracker", fresh: "Fresh Start", money: "Money" };
  const ORDER = ["mind", "workout", "fresh", "money"];
  const defs = [];
  const hooks = {};

  // Events that start inside an app are heard on the app's own box (its shadow root),
  // so the app sees the real element that was tapped. Other events go to the page.
  const UI_EVENTS = new Set(["click", "dblclick", "mousedown", "mouseup", "mousemove", "mouseover", "mouseout",
    "pointerdown", "pointerup", "pointermove", "pointercancel", "pointerover", "pointerout",
    "touchstart", "touchend", "touchmove", "touchcancel", "keydown", "keyup", "keypress",
    "input", "change", "submit", "reset", "focusin", "focusout", "contextmenu", "wheel",
    "dragstart", "dragover", "dragenter", "dragleave", "drop", "dragend", "paste", "copy", "cut", "toggle"]);

  // A stand-in for "document" that each app sees. It looks inside the app's own box first.
  function makeDoc(root, host, body) {
    const real = document;
    const own = {
      getElementById: id => root.getElementById(id),
      querySelector: s => root.querySelector(s) || (/^(meta|head|link|title)\b/.test(s) ? real.querySelector(s) : null),
      querySelectorAll: s => root.querySelectorAll(s),
      getElementsByClassName: c => root.querySelectorAll("." + c),
      getElementsByTagName: t => root.querySelectorAll(t),
      addEventListener: (t, f, o) => (UI_EVENTS.has(t) ? root : real).addEventListener(t, f, o),
      removeEventListener: (t, f, o) => (UI_EVENTS.has(t) ? root : real).removeEventListener(t, f, o),
      // A node inside the app's box counts as part of the document.
      contains: n => !!n && (root.contains(n) || real.contains(n)),
      get documentElement() { return host; },
      get body() { return body; },
      get activeElement() { return root.activeElement || body; },
    };
    return new Proxy(own, {
      get(t, k) {
        if (k in t) return t[k];
        const v = real[k];
        return typeof v === "function" ? v.bind(real) : v;
      },
      set(t, k, v) { real[k] = v; return true; },
    });
  }

  function define(key, label, css, markup, factory) { defs.push({ key, label, css, markup, factory }); }

  /* ---------- look: follows the medical side of All in One ---------- */
  // hub-web.js copies All in One's light/dark mode and color theme onto this page (data-theme + --aio-* colors)
  // and fires "aio-look" when they change. Each app box gets the same light/dark setting.
  function applyTheme() {
    const v = document.documentElement.getAttribute("data-theme");
    for (const el of document.querySelectorAll(".hub-app[id^='app-']")) {
      if (v) el.setAttribute("data-theme", v); else el.removeAttribute("data-theme");
      el.removeAttribute("data-color");
    }
  }
  window.addEventListener("aio-look", applyTheme);
  function setupSettings() { applyTheme(); }

  function start() {
    setupSettings();
    for (const d of defs) {
      const host = document.getElementById("app-" + d.key);
      const root = host.attachShadow({ mode: "open" });
      root.innerHTML = `<style>${d.css}</style><div class="hub-body">${d.markup}</div>`;
      const body = root.querySelector(".hub-body");
      try {
        d.factory(makeDoc(root, host, body), h => { hooks[d.key] = h; });
      } catch (err) {
        console.error(d.label, err);
        const p = document.createElement("p");
        p.className = "hub-crash";
        p.textContent = `${d.label} hit an error while starting: ${err && err.message}`;
        host.before(p);
      }
    }
    setupTabs();
  }

  /* ---------- tabs ---------- */
  const FRESH_VIEWS = ["today", "school", "work", "record", "files", "settings", "bin"];
  function showTab(name) {
    document.querySelectorAll("#hub-tabs button").forEach(b => b.setAttribute("aria-selected", String(b.dataset.tab === name)));
    const cur = document.querySelector(`#hub-tabs [data-tab="${name}"]`);
    if (cur) document.getElementById("hub-current").textContent = cur.textContent.trim();
    document.querySelectorAll(".hub-app").forEach(a => {
      const on = a.id === "app-" + name;
      a.classList.toggle("on", on);
      a.inert = !on;
    });
    try { localStorage.setItem("hub_tab", name); } catch {}
    window.dispatchEvent(new Event("resize"));
  }
  // Phone menu: the ☰ button slides the tab list in from the left; picking a tab, tapping outside or Esc closes it
  const phone = window.matchMedia("(max-width: 767px)");
  function setMenu(open) {
    document.body.classList.toggle("hub-menu-open", open);
    document.getElementById("hub-menu-btn").setAttribute("aria-expanded", String(open));
    document.getElementById("hub-side").inert = phone.matches && !open;
    if (open) setTimeout(() => document.querySelector("#hub-tabs [aria-selected='true']")?.focus({ preventScroll: true }), 220);
  }
  const COLLAPSED_KEY = "hub_nav_collapsed";
  function applyCollapsed() {
    let on = false;
    try { on = localStorage.getItem(COLLAPSED_KEY) === "1"; } catch {}
    document.body.classList.toggle("hub-collapsed", on);
  }
  // Called by the ☰ button in All in One's header
  function toggleMenu() {
    if (phone.matches) { setMenu(!document.body.classList.contains("hub-menu-open")); return; }
    const on = !document.body.classList.contains("hub-collapsed");
    try { localStorage.setItem(COLLAPSED_KEY, on ? "1" : "0"); } catch {}
    applyCollapsed();
    window.dispatchEvent(new Event("resize"));
  }
  window.hubToggleMenu = toggleMenu;
  function setupMenu() {
    applyCollapsed();
    document.getElementById("hub-menu-btn").addEventListener("click", () => setMenu(!document.body.classList.contains("hub-menu-open")));
    document.getElementById("hub-scrim").addEventListener("click", () => setMenu(false));
    document.addEventListener("keydown", e => { if (e.key === "Escape" && document.body.classList.contains("hub-menu-open")) { setMenu(false); document.getElementById("hub-menu-btn").focus(); } });
    phone.addEventListener("change", () => setMenu(false));
    setMenu(false);
  }
  function setupTabs() {
    setupMenu();
    document.querySelectorAll("#hub-tabs button").forEach(b => b.addEventListener("click", () => { showTab(b.dataset.tab); setMenu(false); window.scrollTo(0, 0); }));
    let first = "mind", saved = null;
    try { saved = localStorage.getItem("hub_tab"); first = saved || "mind"; } catch {}
    const h = location.hash.slice(1);
    // Fresh Start is turned off in this version
    if (first === "fresh" || !document.getElementById("app-" + first)) first = "mind";
    showTab(first);
  }

  /* ---------- waiting for an app to finish loading its data ---------- */
  async function waitReady(key, ms = 15000) {
    const end = Date.now() + ms;
    while (Date.now() < end) {
      const h = hooks[key];
      try { if (h && h.ready()) return true; } catch {}
      await new Promise(r => setTimeout(r, 250));
    }
    return false;
  }

  const $ = id => document.getElementById(id);

  async function saveFile(filename, text) {
    let dl = null;
    try { dl = window.claude && window.claude.use ? await window.claude.use("downloads") : null; } catch {}
    if (dl) {
      try { const r = await dl.save({ filename, data: text }); return r && r.status === "saved" ? "saved" : r && r.status === "unconfirmed" ? "unconfirmed" : "ready"; }
      catch (e) { return e && e.code === "declined" ? "declined" : "failed"; }
    }
    const a = document.createElement("a");
    a.href = URL.createObjectURL(text instanceof Blob ? text : new Blob([text], { type: "application/json" }));
    a.download = filename; document.body.append(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    return "ready";
  }

  /* ---------- cleaning up stored files nothing uses ---------- */
  // Only Mind Tracker (journal photos) and Fresh Start (documents) keep stored files.
  // A file counts as used if either app still points at it. If either app has not loaded, nothing is shown.
  const FILE_APPS = ["mind", "fresh"];
  const DAY_MS = 864e5;
  let leftovers = [];
  const sizeText = b => b >= 1048576 ? (b / 1048576).toFixed(1) + " MB" : Math.max(1, Math.round(b / 1024)) + " KB";
  async function usedFileIds() {
    const used = new Set();
    for (const key of FILE_APPS) {
      const h = hooks[key];
      if (!h || !h.fileIds || !await waitReady(key, 15000)) throw new Error(`${LABELS[key]} has not finished loading. Wait a moment and try again.`);
      for (const id of await h.fileIds()) used.add(String(id));
    }
    return used;
  }
  // Used from All in One's main Settings (My Hub tab). Returns what it found; the Settings tab draws the list.
  async function findLeftovers() {
    const assets = window.claude && window.claude.use ? await window.claude.use("assets") : null;
    if (!assets) return { message: "There is no file storage here, so there is nothing to clean up.", files: [] };
    const used = await usedFileIds();
    const all = (await assets.list()).assets || [];
    const now = Date.now();
    // Files added in the last day are skipped: one may belong to an entry that is still being written.
    if (!all.length) return { message: "There are no saved photos or documents yet. Nothing to clean up.", files: [] };
    const unused = all.filter(a => a && a.id && !used.has(a.id));
    leftovers = unused.filter(a => !(a.createdAt && now - new Date(a.createdAt).getTime() < DAY_MS));
    const recent = unused.length - leftovers.length;
    const skip = recent ? ` ${recent} file${recent === 1 ? "" : "s"} added in the last day ${recent === 1 ? "was" : "were"} skipped.` : "";
    if (!leftovers.length) return { message: (recent ? "Nothing to clean up." : `All ${all.length} saved file${all.length === 1 ? " is" : "s are"} in use. Nothing to clean up.`) + skip, files: [] };
    const bytes = leftovers.reduce((t, a) => t + (a.sizeBytes || 0), 0);
    return {
      message: `${leftovers.length} of ${all.length} saved files are not used by anything (${sizeText(bytes)}). Untick any you want to keep.${skip}`,
      files: leftovers.map(a => ({ id: a.id, contentType: a.contentType || "", sizeBytes: a.sizeBytes || 0, createdAt: a.createdAt || "", size: sizeText(a.sizeBytes || 0) }))
    };
  }
  // Saves a zip copy first, then deletes. progress(text) shows how far it got. Returns the final message.
  async function deleteLeftovers(ids, progress = () => {}) {
    const want = new Set(ids.map(String));
    const list = leftovers.filter(a => want.has(a.id));
    if (!list.length) return "Nothing was picked.";
    const assets = await window.claude.use("assets");
    // Check again right before deleting, in case an app started using one in the meantime.
    const used = await usedFileIds();
    const del = list.filter(a => !used.has(a.id));
    if (!del.length) { leftovers = leftovers.filter(a => !list.includes(a)); return "All the picked files are in use now, so nothing was deleted."; }
    if (!window.JSZip) throw new Error("The zip maker did not load. Reload the page and try again.");
    const zip = new JSZip(); let n = 0;
    for (const a of del) {
      progress(`Copying file ${++n} of ${del.length}…`);
      const r = await fetch("_blob/" + encodeURIComponent(a.id));
      if (!r.ok) throw new Error("A file could not be copied, so nothing was deleted.");
      const ext = ((a.contentType || "").split("/")[1] || "bin").replace(/[^a-z0-9]/gi, "").slice(0, 5) || "bin";
      zip.file(`${a.id}.${ext === "jpeg" ? "jpg" : ext}`, await r.blob());
    }
    progress("Saving the copy…");
    const d = new Date();
    const saved = await saveFile(`my-hub-leftover-files-${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}.zip`,
      await zip.generateAsync({ type: "blob", mimeType: "application/zip" }));
    if (saved !== "saved" && saved !== "ready") return "The copy was not saved, so nothing was deleted.";
    let ok = 0, freed = 0;
    for (const a of del) {
      progress(`Deleting ${ok + 1} of ${del.length}…`);
      try { await assets.delete(a.id); ok++; freed += a.sizeBytes || 0; } catch {}
    }
    leftovers = leftovers.filter(a => !del.includes(a));
    return `Deleted ${ok} file${ok === 1 ? "" : "s"} and freed ${sizeText(freed)}. The copy is in the zip you just saved.` +
      (ok < del.length ? ` ${del.length - ok} could not be deleted.` : "");
  }
  window.HubSettings = {
    findLeftovers,
    deleteLeftovers,
    // Each app's own settings page, opened from All in One's main Settings (their buttons are hidden in the hub)
    toggleMenu: () => window.hubToggleMenu && window.hubToggleMenu(),
    open: app => {
      if (app === "mind") {
        showTab("mind");
        const b = document.getElementById("app-mind").shadowRoot?.getElementById("settingsBtn");
        if (b) b.click();
      } else if (app === "fresh") {
        showTab("fresh");
        if (location.hash !== "#settings") location.hash = "#settings";
      }
      window.scrollTo(0, 0);
    },
    // A picture the Settings window can show even before the offline helper is running
    thumb: async id => { const r = await fetch("_blob/" + encodeURIComponent(id)); if (!r.ok) throw new Error("missing"); return URL.createObjectURL(await r.blob()); },
  };

  /* ---------- Insights tab: a week across all apps, and links between them ---------- */
  const pad2 = n => String(n).padStart(2, "0");
  const isoDay = d => `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
  const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
  const monday = d => { const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); return addDays(x, -((x.getDay() + 6) % 7)); };
  const moodColor = s => s >= 8 ? "#2f9e5b" : s >= 6 ? "#c99a10" : s >= 4 ? "#e07b2c" : "#d64545";
  const esc = t => String(t).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  let insWeek = 0;
  const INS_APPS = ["mind", "workout"];
  const pl = (n, w) => `${n} ${w}${n === 1 ? "" : "s"}`;

  async function gather() {
    const out = {};
    for (const key of INS_APPS) {
      const h = hooks[key];
      if (!h || !h.peek || !await waitReady(key, 6000)) continue;
      try { out[key] = h.peek(); } catch {}
    }
    return out;
  }
  // One map per kind of day: date -> value.
  function dayMaps(d) {
    const mood = {}, journal = {}, work = {};
    for (const m of (d.mind && d.mind.moods) || []) if (m && m.date && typeof m.score === "number") mood[m.date] = m.score;
    for (const e of (d.mind && d.mind.journal) || []) if (e && e.date) journal[e.date] = (journal[e.date] || 0) + 1;
    const w = d.workout;
    if (w && Array.isArray(w.days)) {
      const byId = Object.fromEntries(w.days.map(x => [x.id, x.date]));
      for (const [k, v] of Object.entries(w.marks || {})) {
        const date = byId[k.split(":")[0]];
        if (date && v === "done") work[date] = (work[date] || 0) + 1;
      }
    }
    return { mood, journal, work };
  }
  const avg = a => a.length ? a.reduce((x, y) => x + y, 0) / a.length : null;

  function statCard(label, big, sub, go) {
    const name = { journal: "Journal", mood: "Mood", workout: "Workouts" }[go];
    const btn = go ? `<button type="button" class="hub-btn ins-go" data-go="${go}" aria-label="Open ${name}" title="Open ${name}">↗</button>` : "";
    return `<div class="ins-stat">${btn}<span class="lbl">${label}</span><span class="big">${big}</span><span class="sub">${sub}</span></div>`;
  }
  function trend(now, before, unit) {
    if (now == null || before == null) return "";
    const diff = Math.round((now - before) * 10) / 10;
    if (!diff) return " · same as last week";
    return ` · <span class="${diff > 0 ? "ins-up" : "ins-down"}">${diff > 0 ? "▲" : "▼"} ${Math.abs(diff)}${unit}</span> vs last week`;
  }

  function linkRow(q, aLabel, aVals, bLabel, bVals, good, bad) {
    const a = avg(aVals), b = avg(bVals);
    const bar = (lbl, v, n, cls) => `<div class="ins-bar"><span>${lbl} <span class="hub-muted">(${n})</span></span><span class="track"><span class="fill ${cls}" style="width:${v == null ? 0 : v * 10}%"></span></span><b>${v == null ? "–" : v.toFixed(1)}</b></div>`;
    let ans;
    if (aVals.length < 3 || bVals.length < 3) ans = `<span class="hub-muted">Not enough days yet. This shows when there are 3 or more days of each kind with a mood.</span>`;
    else {
      const diff = Math.round((a - b) * 10) / 10;
      ans = Math.abs(diff) < 0.3 ? "About the same mood either way."
        : diff > 0 ? `Your mood is <b>${diff} points higher</b> ${good}.` : `Your mood is <b>${-diff} points lower</b> ${bad}.`;
    }
    return `<div class="ins-link"><span class="q">${q}</span>${bar(aLabel, a, aVals.length, "")}${bar(bLabel, b, bVals.length, "b")}<span class="ans">${ans}</span></div>`;
  }

  async function renderInsights() {
    $("ins-status").textContent = "Reading your apps…";
    const d = await gather();
    const M = dayMaps(d);
    const todayIso = isoDay(new Date());
    const start = addDays(monday(new Date()), insWeek * 7);
    const days = [...Array(7)].map((_, i) => isoDay(addDays(start, i)));
    const prev = [...Array(7)].map((_, i) => isoDay(addDays(start, i - 7)));
    const end = addDays(start, 6);
    const fmt = x => x.toLocaleDateString("en-US", { month: "short", day: "numeric" });
    $("ins-week-h").textContent = insWeek === 0 ? "This week" : insWeek === -1 ? "Last week" : `${-insWeek} weeks ago`;
    $("ins-week-d").textContent = `${fmt(start)} – ${fmt(end)}`;
    $("ins-next").disabled = insWeek >= 0;

    // Day strip
    $("ins-days").innerHTML = days.map((k, i) => {
      const dt = addDays(start, i), m = M.mood[k];
      const ic = [M.work[k] ? "💪" : ""].filter(Boolean).join("");
      return `<div class="ins-day ${k === todayIso ? "today" : ""}"><span class="dn">${dt.toLocaleDateString("en-US", { weekday: "short" })}</span><span>${dt.getDate()}</span>
        <span class="mood ${m == null ? "none" : ""}" style="${m == null ? "" : "background:" + moodColor(m)}">${m == null ? "" : m}</span><span class="ic">${ic}</span></div>`;
    }).join("");

    // Weekly report
    const vals = (map, ks) => ks.map(k => map[k]).filter(v => v != null);
    const cnt = (map, ks) => ks.filter(k => map[k]).length;
    const sum = (map, ks) => ks.reduce((t, k) => t + (map[k] || 0), 0);
    const cards = [];
    if (d.mind) {
      const a = avg(vals(M.mood, days)), b = avg(vals(M.mood, prev));
      cards.push(statCard("🧠 Mood", a == null ? "–" : a.toFixed(1), `average of ${pl(vals(M.mood, days).length, "day")}${trend(a && +a.toFixed(1), b && +b.toFixed(1), "")}`, "mood"));
    }
    if (d.workout) cards.push(statCard("💪 Workouts", cnt(M.work, days), `${cnt(M.work, days) === 1 ? "day" : "days"} worked out (${sum(M.work, days)} done)${trend(cnt(M.work, days), cnt(M.work, prev), "")}`, "workout"));
    $("ins-report").innerHTML = cards.join("") || `<p class="hub-muted">No data yet.</p>`;
    const missing = INS_APPS.filter(k => !d[k]).map(k => LABELS[k]);
    $("ins-status").textContent = missing.length ? `Still loading: ${missing.join(", ")}. Open this tab again in a moment.` : "";

    // Links between apps (last 90 days, only days with a mood)
    const from = isoDay(addDays(new Date(), -89));
    const moodDays = Object.keys(M.mood).filter(k => k >= from && k <= todayIso);
    const split = map => [moodDays.filter(k => map[k]).map(k => M.mood[k]), moodDays.filter(k => !map[k]).map(k => M.mood[k])];
    const [wA, wB] = split(M.work), [jA, jB] = split(M.journal);
    $("ins-links").innerHTML = !d.mind ? `<p class="hub-muted">Mind Tracker has not loaded yet.</p>` : [
      linkRow("💪 Workout days", "Worked out", wA, "No workout", wB, "on days you work out", "on days you work out"),
    ].join("");
  }
  $("ins-prev").onclick = () => { insWeek--; renderInsights(); };
  $("ins-next").onclick = () => { if (insWeek < 0) { insWeek++; renderInsights(); } };
  // The small ↗ button on a card opens that part of the app.
  $("ins-report").addEventListener("click", ev => {
    const b = ev.target.closest("[data-go]");
    if (!b) return;
    const go = b.dataset.go, app = go === "workout" ? "workout" : "mind";
    showTab(app);
    window.scrollTo(0, 0);
    const root = document.getElementById("app-" + app).shadowRoot;
    const inner = root && root.querySelector(go === "workout" ? "#nav-tracker" : `.tab[data-tab="${go}"]`);
    if (inner) inner.click();
  });
  document.getElementById("tab-insights").addEventListener("click", () => { insWeek = 0; renderInsights(); });
  window.addEventListener("load", () => { if (document.getElementById("app-insights").classList.contains("on")) renderInsights(); });

  /* ---------- alerts from an app whose tab is hidden ---------- */
  let toastFor = "", toastTimer;
  function notify(msg, key) {
    toastFor = key;
    $("hub-toast-msg").textContent = msg + (LABELS[key] ? ` (${LABELS[key]})` : "");
    $("hub-toast").hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { $("hub-toast").hidden = true; }, 60000);
  }
  $("hub-toast-open").onclick = () => { $("hub-toast").hidden = true; if (toastFor) { showTab(toastFor); window.scrollTo(0, 0); } };
  $("hub-toast-close").onclick = () => { $("hub-toast").hidden = true; };

  return { define, start, notify };
})();
</script>

ms: stretch; }\n  .dialog-btns .btn { width: 100%; }\n}\n\n\n\n\n.settings-title { margin: 0; font-size: 1.15rem; color: var(--title); }\n.settings-body { max-width: 640px; }\n.set-group { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; margin-bottom: 14px; }\n.set-group h3 { margin: 0 0 10px; font-size: 1.05rem; }\n.set-group p { margin: 0 0 10px; }\n.set-group .hint { margin: 8px 0 0; }\n.set-label { font-weight: 600; font-size: 0.9rem; margin: 12px 0 8px; }\n.set-group h3 + .set-label { margin-top: 0; }\n.seg { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; background: var(--chip); padding: 4px; border-radius: 12px; }\n.seg button {\n  border: none; background: transparent; color: var(--text); font: inherit; font-size: 0.9rem;\n  padding: 9px 4px; border-radius: 9px; cursor: pointer; min-height: 40px;\n}\n.seg button[aria-checked=\"true\"] { background: var(--card); color: var(--title); font-weight: 700; box-shadow: var(--shadow); }\n.swatches { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 8px; }\n.swatches button {\n  display: flex; align-items: center; gap: 10px; text-align: left; min-height: 46px;\n  border: 1px solid var(--line); background: var(--input); color: var(--text); font: inherit; font-size: 0.9rem;\n  padding: 8px 10px; border-radius: 12px; cursor: pointer;\n}\n.swatches button:hover { background: var(--chip); }\n.swatches button[aria-checked=\"true\"] { border-color: var(--primary); box-shadow: inset 0 0 0 1px var(--primary); font-weight: 700; }\n.swatches .dot { width: 24px; height: 24px; border-radius: 50%; flex-shrink: 0; box-shadow: inset 0 0 0 2px rgba(255,255,255,0.35); }\n.swatches .tick { margin-left: auto; color: var(--primary); font-weight: 800; }\n.set-group .row { flex-wrap: wrap; }\n@media (max-width: 480px) {\n  .swatches { grid-template-columns: repeat(2, minmax(0, 1fr)); }\n}\n\n.seg.four { grid-template-columns: rep ;--line:var(--aio-line,#2e2e2e)!important;--primary:var(--aio-btn,#e6e6e6)!important;--primary-dark:var(--aio-btn,#e6e6e6)!important;--on-btn:var(--aio-on-btn,#111111)!important;--header:var(--aio-header,#141414)!important;--shadow:0 1px 3px rgba(0,0,0,.6)!important}\n\n.hub-body{background:transparent!important;min-height:100vh}\n\n#settingsBtn,#backupNudge,.card.backup,.backup-item,#setBackup,#backupLabel,#backupSeg,.set-actions{display:none!important}\n.hub-body{font-family:\"Inter\",system-ui,-apple-system,\"Segoe UI\",sans-serif!important;font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}\nh1,h2,h3,h4{font-family:\"Inter\",system-ui,-apple-system,\"Segoe UI\",sans-serif!important;letter-spacing:-.01em}\nh1{font-size:26px!important;font-weight:700!important;line-height:1.2!important;text-align:left!important}\nh2{font-size:18px!important;font-weight:700!important}\ninput:not([type=checkbox]):not([type=radio]):not([type=range]),select,textarea{border-radius:10px!important;font-family:\"Inter\",system-ui,-apple-system,\"Segoe UI\",sans-serif!important}\ndialog{border-radius:14px!important}\n\n.top{max-width:720px;margin:0 auto;padding:16px 16px 0!important;text-align:left!important;background:transparent!important}\n.today{font-size:13px;margin-top:2px!important}\n.tabs{position:static!important;max-width:720px;margin:0 auto;justify-content:stretch!important;background:transparent!important;border:0!important;padding:12px 16px 0!important}\n.tab{border-radius:10px!important;font-family:\"Inter\",system-ui,-apple-system,\"Segoe UI\",sans-serif!important;font-weight:600!important;font-size:14px!important;max-width:none!important;padding:10px 4px!important;white-space:nowrap;border:1px solid var(--line)!important;background:var(--card)!important;color:var(--text)!important}\n.tab.active{background:var(--primary)!important;border-color:var(--primary)!important;color:var(--on-btn)!important}\n.btn{border-radius:10px!important;font-family:\"Inter\",system-ui,-apple-system,\"Segoe UI\",sans-serif!important;font-weight:600!important;font-size:14px!important}\n.btn.small{font-size:13px!important}\n.btn.primary{color:var(--on-btn)!important}\n.btn.ghost{background:var(--card)!important}\n.card{border-radius:14px!important;box-shadow:none!important;border:1px solid var(--line)!important}\n.toast{background:var(--text)!important;color:var(--bg)!important;border-radius:10px!important;font-size:14px}\n", "<header class=\"top\">\n    <div class=\"top-btns\">\n      <button type=\"button\" class=\"theme-btn\" id=\"settingsBtn\" aria-label=\"Settings\" aria-haspopup=\"dialog\">\u2699\ufe0f<span class=\"lbl\"> Settings</span></button>\n    </div>\n    <h1>Mind Tracker</h1>\n    <p class=\"today\" id=\"todayLabel\"></p>\n    <p class=\"sync hidden\" id=\"syncStatus\" role=\"status\"></p>\n  </header>\n\n  <nav class=\"tabs\" role=\"tablist\" style=\"display:none\">\n    <button class=\"tab\" data-tab=\"mood\" role=\"tab\">\ud83c\udf08 Mood</button>\n  </nav>\n\n  <main>\n    <div id=\"missedNote\" class=\"card nudge missed hidden\" role=\"status\"></div>\n    <div id=\"backupNudge\" class=\"card nudge hidden\" role=\"status\">\n      <p id=\"nudgeText\"></p>\n      <div class=\"row\">\n        <button type=\"button\" class=\"btn primary small\" id=\"nudgeSave\">\ud83d\udcbe Save backup now</button>\n        <button type=\"button\" class=\"btn ghost small\" id=\"nudgeLater\">Remind me tomorrow</button>\n      </div>\n    </div>\n    <!-- JOURNAL -->\n    <section id=\"journal\" class=\"panel\" style=\"display:none\">\n      <form id=\"journalForm\" class=\"card form-card\">\n        <h2 id=\"journalFormTitle\">New entry</h2>\n        <label>Date\n          <input type=\"date\" id=\"journalDate\" required>\n        </label>\n        <label>Title (optional)\n          <input type=\"text\" id=\"journalTitle\" maxlength=\"100\" placeholder=\"How was today?\">\n        </label>\n        <div class=\"prompt-box\">\n          <p id=\"promptText\" class=\"prompt-text hidden\"></p>\n          <button type=\"button\" class=\"btn ghost small\" id=\"promptBtn\">\ud83d\udca1 Give me a prompt</button>\n        </div>\n        <label>Entry\n          <textarea id=\"journalText\" rows=\"12\" required maxlength=\"50000\" placeholder=\"Write anything...\"></textarea>\n        </label>\n        <div class=\"photo-box\">\n          <div class=\"photo-strip\" id=\"jPhotos\"></div>\n          <button type=\"button\" class=\"btn ghost small\" id=\"addPhotoBtn\">\ud83d\udcf7 Add photos</button>\n          <input type=\"file\" id=\"photoInput\" accept=\"image/*\" multiple hidden>\n        </div>\n        <div class=\"carry hidden\" id=\"carryNote\" role=\"status\"></div>\n        <div class=\"wheel-box\">\n          <div class=\"wheel-head\">\n            <span class=\"wheel-title\">Mood for this day</span>\n            <span class=\"est\" id=\"wheelNote\"></span>\n          </div>\n          <div class=\"wheel-wrap\">\n            <div class=\"wheel\" id=\"moodWheel\" tabindex=\"0\" role=\"slider\" aria-label=\"Mood for this day: DSIP (day still in progress) or 1 to 10\"\n                 aria-valuemin=\"0\" aria-valuemax=\"10\" aria-valuenow=\"5\"></div>\n          </div>\n          <div class=\"wheel-foot\">\n            <label class=\"check\">\n              <input type=\"checkbox\" id=\"autoMood\">\n              Auto-guess mood from what I write\n            </label>\n            <button type=\"button\" class=\"btn ghost small hidden\" id=\"wheelReset\">Use auto guess</button>\n          </div>\n        </div>\n        <div class=\"row\">\n          <button type=\"submit\" class=\"btn primary\" id=\"journalSave\">Save entry</button>\n          <button type=\"button\" class=\"btn ghost hidden\" id=\"journalCancel\">Cancel edit</button>\n        </div>\n      </form>\n\n      <details class=\"card therapy\" id=\"therapyCard\">\n        <summary><span>\ud83d\uddc2 For my next session</span><span class=\"count\   if (plain.endsWith("ied")) tries.push(plain.slice(0, -3) + "y");
  if (plain.endsWith("ing")) tries.push(plain.slice(0, -3), plain.slice(0, -3) + "e", plain.slice(0, -4));

  if (est.hits === 0 && existing && (existing.star || existing.tags.length || existing.note)) return; // keep what you added to it
  moods = moods.filter(m => m.date !== date);
  if (est.hits > 0) {

  }

  if (missedDays.includes(date)) { missedDays = missedDays.filter(d => d !== date); save(KEYS.missed, missedDays); }

  if (!days.length) return [];

  for (const d of days) {

    if (m && !m.auto) continue; // rated meanwhile
    // Use all of that day's entries, even ones with auto-guess turned off.
    const text = journal.filter(e => e.date === d).map(e => `${e.title} ${e.text}`).join(" ");
    const est = estimateMood(text);
    if (est.hits) {
      moods = moods.filter(x => x.date !== d);
      moods.push({ date: d, score: est.score, note: m ? m.note : "", tags: m ? m.tags : [], auto: true, star: !!(m && m.star) });

// Send waiting uploads and deletes to your online space.
let photoFlushing = false;
async function photoFlush() {
  const col = photoRemote();
  if (photoFlushing) return;
  photoFlushing = true;
  try {
    // Photos in file storage that no entry uses any more.
    if (await photoAssetsReady) {
      for (const id of photoOutbox().del.filter(assetIdOf)) {
        try { await photoAssets.delete(assetIdOf(id)); } catch (err) { if (!err || err.code !== "not_found") break; }
        const o = photoOutbox(); o.del = o.del.filter(x => x !== id); saveLocal("mt_photo_outbox", o);
      }
    }
    if (!col) return;
    let ob = photoOutbox();
    const refs = photoRefsOf(journal, trash);
    for (const id of ob.up) {
      const used = refs.has(id);
      const data = used ? await photoGet(id) : null;
      if (used && !data) continue; // keep it; try again later
      if (data) {
        try { await col.doc(id).set({ data, created: Date.now() }); }
        catch (err) {
          if (err && err.code === "quota_exceeded") toast("Online storage is full. Your photo is kept on this device only.", 8000);
          else break; // try again later
        }
      }
      ob = photoOutbox(); ob.up = ob.up.filter(x => x !== id); saveLocal("mt_photo_outbox", ob);
    }
    for (const id of photoOutbox().del.filter(x => !assetIdOf(x))) {
      try { await col.doc(id).delete(); } catch (err) { if (!err || err.code !== "not_found") break; }
      ob = photoOutbox(); ob.del = ob.del.filter(x => x !== id); saveLocal("mt_photo_outbox", ob);
    }
  } finally { photoFlushing = false; }
}
// Remove photos on this device that no entry uses any more.
async function photoCleanLocal() {
  const keys = await photoTx("readonly", st => st.getAllKeys());
  if (!Array.isArray(keys)) return;
  const refs = photoRefsOf(journal, trash);
  for (const id of keys) if (!refs.has(id) && !formPhotos.includes(id)) { photoMem.delete(id); photoTx("readwrite", st => st.delete(id)); }
}
// Move photos from the smaller online space to file storage (once, when this page has file storage).
let photoMoving = false;
async function photoMoveToAssets() {
  if (photoMoving || !(await photoAssetsReady)) return;
  photoMoving = true;
  try {
    for (const id of photoRefsOf(journal, trash)) {
      if (assetIdOf(id)) continue;
      const data = await photoGet(id);
      if (!data) continue;
      const nid = await photoToAssets(data);
      if (!nid) break;
      const swap = e => { if (e && Array.isArray(e.photos)) e.photos = e.photos.map(x => (x === id ? nid : x)); };
      journal.forEach(swap);
      trash.forEach(t => t.kind === "j" && swap(t.item));
      formPhotos = formPhotos.map(x => (x === id ? nid : x));
      save(KEYS.journal, journal);
      save(KEYS.trash, trash); // the old copy is removed by the photo check that follows
    }
  } finally { photoMoving = false; }
  renderAll();
}
// Photos of entries that left the recycle bin by age: delete them, if no entry uses them now.
function photoExpiredFlush() {
  let list = [];
  try { list = JSON.parse(localStorage.getItem("mt_photo_expired") || "[]"); } catch {}
  if (!Array.isArray(list) || !list.length) return;
  const refs = photoRefsOf(journal, trash);
  const ob = photoOutbox();
  for (const id of list) {
    if (typeof id !== "string" || !ID_RE.test(id) || refs.has(id) || formPhotos.includes(id)) continue;
    photoMem.delete(id);
    photoTx("readwrite", st => st.delete(id));
    ob.up = ob.up.filter(x => x !== id);
    if (!ob.del.includes(id)) ob.del.push(id);
  }
  saveLocal("mt_photo_outbox", ob);
  try { localStorage.removeItem("mt_photo_expired"); } catch {}
}
// Called by sync when it connects (and once here, for when there is no sync).
function photoSyncReady() { photoExpiredFlush(); photoKnown = photoRefsOf(journal, trash); photoRefsCheck(true); photoCleanLocal(); photoMoveToAssets(); }

// Make a photo smaller, as a JPEG data URL that fits in one online record.
function shrinkPhoto(file) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      URL.revokeObjectURL(url);
      for (const [max, q] of [[1280, 0.75], [1280, 0.6], [1024, 0.6], [800, 0.55], [640, 0.5]]) {
        const k = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
        const c = document.createElement("canvas");
        c.width = Math.max(1, Math.round(img.naturalWidth * k));
        c.height = Math.max(1, Math.round(img.naturalHeight * k));
        const g = c.getContext("2d");
        g.fillStyle = "#fff"; g.fillRect(0, 0, c.width, c.height);
        g.drawImage(img, 0, 0, c.width, c.height);
        const out = c.toDataURL("image/jpeg", q);
        if (out.length <= PHOTO_MAX_CHARS) return res(out);
      }
      rej(new Error("too big"));
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error("not an image")); };
    img.src = url;
  });
}

/* ---------- Mood wheel (journal form) ----------
   A row of numbers 1-10 you scroll sideways. The number in the ring is picked.
   It starts on your saved mood or the auto guess. Once you move it, your number wins. */
const wheel = document.getElementById("moodWheel");
const wheelNote = document.getElementById("wheelNote");
const wheelReset = document.getElementById("wheelReset");
const STEP = 56;            // width of one number, in pixels
let wheelValue = 5;
let wheelTouched = false;   // you picked a number yourself
let wheelUser = false;      // a scroll you started is still moving
let wheelShown = -1;        // position the wheel is scrolled to (-1 = not yet)
let wheelTimer, wheelSpinAt = 0;

// Position 0 is "DSIP" (day still in progress); 1-10 are mood numbers.
const DSIP = 0;
for (let n = 0; n <= 10; n++) {
  const b = document.createElement("button");
  b.type = "button";
  b.textContent = n === DSIP ? "DSIP" : n;
  if (n === DSIP) { b.classList.add("dsip"); b.title = "Day still in progress"; }
  b.dataset.n = n;
  b.tabIndex = -1;
  b.setAttribute("aria-hidden", "true");
  wheel.appendChild(b);
}
const wheelBtns = [...wheel.children];

function paintWheel(v, isSet) {
  wheelBtns.forEach((b, i) => {
    const on = i === v;
    b.classList.toggle("on", on);
    b.style.color = on && isSet && v !== DSIP ? moodColor(v) : "";
  });
  wheel.classList.toggle("unset", !isSet);
  wheel.setAttribute("aria-valuenow", v);
  wheel.setAttribute("aria-valuetext", v === DSIP ? "Day still in progress" : isSet ? `${v} out of 10` : "not set");
}
function scrollWheelTo(v, smooth) {
  wheelShown = v;
  wheel.scrollTo({ left: v * STEP, behavior: smooth ? "smooth" : "auto" });
}

// What the wheel shows when you have not picked a number yourself.
function wheelSuggestion() {
  const date = jDate.value;
  const existing = moods.find(m => m.date === date);
  if (existing && !existing.auto) return { v: existing.score, set: true, note: "Set by you · scroll to change" };
  const dsipNote = isPending(date) ? "You marked this day DSIP. Pick a number, or DSIP again, or the auto guess is used · " : "";
  if (jAuto.checked) {
    // Same as the saved auto mood: all entries on this day count.
    const others = journal
      .filter(e => e.date === date && e.id !== editingId && e.autoMood !== false)
      .map(e => `${e.title} ${e.text}`).join(" ");
    const est = estimateMood(`${others} ${jTitle.value} ${jText.value}`);
    if (est.hits) return { v: est.score, set: true, note: dsipNote + "Auto guess from your words · scroll to change" };
  }
  if (existing) return { v: existing.score, set: true, note: dsipNote + "Auto guess · scroll to change" };
  return { v: 5, set: false, note: jAuto.checked ? "Keep writing for a guess, or scroll to pick" : "Not set · scroll to pick" };
}

function updateWheel(smooth) {
  if (wheelUser) return; // do not fight a scroll that is still moving
  if (wheelTouched) {
    wheelNote.textContent = wheelValue === DSIP ? "Day still in progress · rate it later" : "Set by you";
    wheelReset.classList.remove("hidden");
    paintWheel(wheelValue, true);
    if (wheelShown !== wheelValue) scrollWheelTo(wheelValue, smooth);
    return;
  }
  const s = wheelSuggestion();
  wheelValue = s.v;
  wheelNote.textContent = s.note;
  wheelReset.classList.add("hidden");
  paintWheel(s.v, s.set);
  if (wheelShown !== s.v) scrollWheelTo(s.v, smooth);
}

function pickWheel(v) {
  v = Math.max(DSIP, Math.min(10, v));
  wheelUser = false;
  wheelTouched = true;
  wheelValue = v;
  updateWheel(true);
}

const wheelIndex = () => Math.max(DSIP, Math.min(10, Math.round(wheel.scrollLeft / STEP)));
// Finger or trackpad scrolling: light up the middle number, then pick it when the scroll stops.
let wheelScrollAt = 0;
["pointerdown", "touchstart"].forEach(t => wheel.addEventListener(t, () => { wheelUser = true; }, { passive: true }));
wheel.addEventListener("scroll", () => {
  wheelScrollAt = Date.now();
  if (wheelUser) paintWheel(wheelIndex(), true);
  clearTimeout(wheelTimer);
  wheelTimer = setTimeout(() => {
    wheelShown = wheelIndex();
    if (wheelUser) pickWheel(wheelShown);
  }, 140);
});
// The finger is lifted (or the browser took the touch for a page scroll):
// if the wheel is not moving, stop waiting for it.
["pointerup", "pointercancel", "touchend", "touchcancel"].forEach(t => wheel.addEventListener(t, () => {
  setTimeout(() => { if (wheelUser && Date.now() - wheelScrollAt > 250) wheelUser = false; }, 350);
}, { passive: true }));
// Mouse wheel: one notch moves one number.
// Up/down mouse scrolling only turns the wheel after you click it, so scrolling
// the page past it does not change your mood by accident. Sideways scrolling always works.
wheel.addEventListener("wheel", ev => {
  const sideways = Math.abs(ev.deltaX) > Math.abs(ev.deltaY);
  if (!sideways && !wheel.contains(document.activeElement)) return;
  const d = sideways ? ev.deltaX : ev.deltaY;
  if (!d) return;
  ev.preventDefault();
  const now = Date.now();
  if (now - wheelSpinAt < 120) return;
  wheelSpinAt = now;
  pickWheel(wheelValue + Math.sign(d));
}, { passive: false });
wheel.addEventListener("click", ev => {
  wheel.focus({ preventScroll: true }); // so the mouse wheel can turn it next
  if (ev.target.dataset.n !== undefined) pickWheel(Number(ev.target.dataset.n));
});
wheel.addEventListener("keydown", ev => {
  const moves = { ArrowLeft: -1, ArrowDown: -1, ArrowRight: 1, ArrowUp: 1 };
  if (ev.key in moves) { ev.preventDefault(); pickWheel(wheelValue + moves[ev.key]); }
  else if (ev.key === "Home") { ev.preventDefault(); pickWheel(DSIP); }
  else if (ev.key === "End") { ev.preventDefault(); pickWheel(10); }
});
wheelReset.addEventListener("click", () => { wheelTouched = false; updateWheel(true); });

// The entry box grows with the text, so the whole entry shows without scrolling inside the box.
// The box grows with the text. It is measured with a hidden copy, so the box you are typing in never
// shrinks for a moment: that made the page jump (scroll up) while typing, mostly on iPhone.
let growMirror = null;
function growText() {
  if (!jText.offsetParent) return; // box is not on screen now
  if (!growMirror) {
    growMirror = jText.cloneNode(false);
    growMirror.removeAttribute("id");
    // Only for measuring: never part of the form (no "required", not sent, not checked)
    ["name", "required", "maxlength", "minlength"].forEach(a => growMirror.removeAttribute(a));
    growMirror.disabled = true;
    growMirror.setAttribute("aria-hidden", "true");
    growMirror.tabIndex = -1;
    growMirror.style.cssText = "position:absolute;visibility:hidden;pointer-events:none;left:-9999px;top:0;height:auto;overflow:hidden";
  }
  if (growMirror.parentNode !== jText.parentNode) jText.parentNode.appendChild(growMirror);
  // Same text layout as the real box (some of its styles are tied to its id, which the copy doesn't have)
  const cs = getComputedStyle(jText);
  for (const k of ["boxSizing", "fontFamily", "fontSize", "fontWeight", "fontStyle", "lineHeight", "letterSpacing", "wordSpacing",
    "textTransform", "whiteSpace", "wordBreak", "overflowWrap", "tabSize", "paddingTop", "paddingRight", "paddingBottom", "paddingLeft",
    "borderTopWidth", "borderRightWidth", "borderBottomWidth", "borderLeftWidth", "borderStyle", "minHeight"]) growMirror.style[k] = cs[k];
  growMirror.style.width = jText.offsetWidth + "px";
  growMirror.value = jText.value;
  const h = growMirror.scrollHeight + 2;
  if (Math.abs(h - jText.offsetHeight) < 2) return; // same size: nothing to do
  const y = window.scrollY;
  jText.style.height = h + "px";
  if (window.scrollY !== y) window.scrollTo(0, y);
}

jForm.addEventListener("submit", ev => {
  ev.preventDefault();
  const data = { date: jDate.value, title: jTitle.value.trim(), text: jText.value.trim(), autoMood: jAuto.checked, photos: [...formPhotos] };
  if (!DATE_RE.test(data.date) || !data.text) return;
  if (!data.photos.length) delete data.photos;
  let oldDate = null;
  const editing = editingId && journal.find(x => x.id === editingId);
  if (editing) {
    oldDate = editing.date;
    if (!data.photos) delete editing.photos;
    Object.assign(editing, data, { updated: Date.now() });
  } else {
    journal.push({ id: uid(), created: Date.now(), date: data.date, title: data.title, text: data.text, autoMood: data.autoMood, star: false, ...(data.photos ? { photos: data.photos } : {}) });
  }
  formNewPhotos = []; // saved now
  save(KEYS.journal, journal);
  const dsip = wheelTouched && wheelValue === DSIP;
  if (dsip) {
    // Day still in progress: no score from you yet. A score you set before goes back to the auto guess.
    const ex = moods.find(x => x.date === data.date);
    if (ex && !ex.auto) { ex.auto = true; save(KEYS.mood, moods); }
    if (!isPending(data.date)) pendingDays = cleanDates([...pendingDays, data.date]);
    missedDays = missedDays.filter(d => d !== data.date);
    save(KEYS.pending, pendingDays);
    save(KEYS.missed, missedDays);
  } else if (wheelTouched) {
    // You picked a number on the wheel (or brought one from the Mood tab): save it as your own mood.
    const ex = moods.find(x => x.date === data.date);
    saveMood(data.date, wheelValue, carry ? carry.tags : ex ? ex.tags : []);
  }
  if (oldDate && oldDate !== data.date) syncAutoMood(oldDate);
  syncAutoMood(data.date);
  // Any other day still marked DSIP gets the auto guess now, so it is not forgotten.
  const filled = resolvePending(dsip ? data.date : null, dsip ? null : data.date);

  const m = moods.find(x => x.date === data.date);
  if (filled.length) {
    toast(`Saved. You never rated ${filled.length === 1 ? "one day" : filled.length + " days"}, so the auto guess was used. See the note at the top.`, 6000);
  } else if (dsip) {
    toast("Saved. Day marked DSIP (day still in progress). Rate it later.", 4000);
  } else if (wheelTouched) {
    toast(`Saved. Mood set to ${m.score}/10`, 3000);
  } else if (data.autoMood && m) {
    toast(m.auto ? `Saved. Mood auto-logged: ${m.score}/10` : `Saved. Kept the mood you logged yourself (${m.score}/10).`);
  } else {
    toast("Entry saved.", 2500);
  }
  resetJournalForm();
  renderAll();
});

// Open an entry in the form above, ready to edit.
// True when the journal form has text or photos that are not saved.
function draftDirty() {
  const e = editingId && journal.find(x => x.id === editingId);
  if (formNewPhotos.length) return true;
  if (!e) return !!(jText.value.trim() || jTitle.value.trim());
  const same = (a, b) => a.length === b.length && a.every((x, i) => x === b[i]);
  return jText.value.trim() !== e.text || jTitle.value.trim() !== e.title || jDate.value !== e.date || !same(formPhotos, e.photos || []);
}
// Ask before an unsaved entry is replaced. Gives false when you want to keep it.
async function draftOk() {
  if (!draftDirty()) return true;
  return askConfirm("You have an entry that is not saved. If you continue, it is lost.", "Continue");
}
async function openEntry(id, focusWheel) {
  if (!(await draftOk())) return;
  openEntryNow(id, focusWheel);
}
function openEntryNow(id, focusWheel) {
  const e = journal.find(x => x.id === id);
  if (!e) return renderJournal();

  if (t.dataset.star) return toggleStar(t.dataset.star);
  if (t.dataset.edit) return openEntry(t.dataset.edit, t.dataset.focus === "wheel");
  const delId = t.dataset.del;
  if (delId) {
    // No question needed: the entry goes to the recycle bin, and Undo is shown.
    const e = journal.find(x => x.id === delId);
    if (!e) return renderJournal();
    const moodBefore = moods.find(m => m.date === e.date);
    journal = journal.filter(x => x.id !== delId);
    save(KEYS.journal, journal);
    const tid = moveToBin("j", e);
    syncAutoMood(e.date);
    // Nothing left on a day marked DSIP: drop the DSIP mark, so it never shows as "never rated".
    const dropPending = isPending(e.date) && !journal.some(x => x.date === e.date) && !moods.some(m => m.date === e.date && !m.auto);
    if (dropPending) { pendingDays = pendingDays.filter(d => d !== e.date); save(KEYS.pending, pendingDays); }
    if (editingId === delId) resetJournalForm();
    renderAll();
    toastUndo("Entry moved to the recycle bin.", () => {
      removeFromBin(tid);
      if (!journal.some(x => x.id === e.id)) journal.push(e);
      save(KEYS.journal, journal);
      if (dropPending && !isPending(e.date) && !moods.some(m => m.date === e.date && !m.auto)) { pendingDays = cleanDates([...pendingDays, e.date]); save(KEYS.pending, pendingDays); }
      const now = moods.find(m => m.date === e.date);
      if (!now || now.auto) { // do not replace a mood you set after the delete
        moods = moods.filter(m => m.date !== e.date);
        if (moodBefore) moods.push(moodBefore);
        else syncAutoMood(e.date);
        save(KEYS.mood, moods);
      }
      renderAll();
    });
  }
});

/* ---------- Mood over time chart ---------- */
const trendEl = document.getElementById("trend");
const trendStats = document.getElementById("trendStats");
const RANGES = { week: 7, month: 30, quarter: 90, all: null };
let trendRange = load("mt_chart_range", "week");
if (!(trendRange in RANGES)) trendRange = "week";
const SVGNS = "http://www.w3.org/2000/svg";
const dayNum = iso => { const [y, m, d] = iso.split("-").map(Number); return Date.UTC(y, m - 1, d) / 86400000; };
const shortDate = iso => prettyDate(iso, { month: "short", day: "numeric" });

document.querySelectorAll(".range button").forEach(b => b.addEventListener("click", () => {
  trendRange = b.dataset.range;
  saveLocal("mt_chart_range", trendRange);
  renderTrend();
}));

function renderTrend() {
  document.querySelectorAll(".range button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.range === trendRange)));
  const today = todayISO();
  const sorted = ratedMoods().filter(m => m.date <= today).sort((a, b) => a.date.localeCompare(b.date));
  let startN = dayNum(today) - (RANGES[trendRange] ? RANGES[trendRange] - 1 : 0);
  if (trendRange === "all") startN = sorted.length ? dayNum(sorted[0].date) : dayNum(today);
  const endN = dayNum(today);
  const pts = sorted.filter(m => dayNum(m.date) >= startN);

  const rangeName = { week: "the last 7 days", month: "the last 30 days", quarter: "the last 3 months", all: "all time" }[trendRange];
  if (!pts.length) {
    trendEl.innerHTML = `<p class="empty">No moods logged in ${rangeName}.</p>`;
    trendStats.textContent = "";
    return;
  }

  const W = Math.max(280, trendEl.clientWidth || 600), H = 220;
  const pad = { l: 30, r: 14, t: 14, b: 30 };
  // Long stretches with no moods (over 30 days) are squeezed to a short gap,
  // so one old entry does not crush the rest of the chart into a corner.
  const GAP_DAYS = 30, GAP_W = 6;
  const anchors = [...new Set([startN, ...pts.map(m => dayNum(m.date)), endN])].sort((a, b) => a - b);
  const vAt = new Map([[anchors[0], 0]]), gaps = [];
  for (let i = 1; i < anchors.length; i++) {
    const g = anchors[i] - anchors[i - 1], prev = vAt.get(anchors[i - 1]);
    if (g > GAP_DAYS) gaps.push({ from: anchors[i - 1], to: anchors[i], v: prev + GAP_W / 2 });
    vAt.set(anchors[i], prev + (g > GAP_DAYS ? GAP_W : g));
  }
  const vOf = n => {
    if (vAt.has(n)) return vAt.get(n);
    let i = anchors.findIndex(a => a > n);
    if (i <= 0) return i === 0 ? 0 : vAt.get(anchors[anchors.length - 1]);
    const a = anchors[i - 1], b = anchors[i], va = vAt.get(a), vb = vAt.get(b);
    return va + ((n - a) / (b - a)) * (vb - va);
  };
  const span = Math.max(1, vAt.get(endN));
  const x = n => pad.l + (vOf(n) / span) * (W - pad.l - pad.r);
  const isGap = (a, b) => gaps.some(g => g.from <= a && g.to >= b && b - a > GAP_DAYS);
  const y = v => pad.t + ((10 - v) / 9) * (H - pad.t - pad.b);
  const avg = pts.reduce((s, m) => s + m.score, 0) / pts.length;

  let svg = `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="Line chart of your mood for ${rangeName}">`;
  for (const v of [1, 5, 10]) {
    svg += `<line class="grid" x1="${pad.l}" x2="${W - pad.r}" y1="${y(v)}" y2="${y(v)}"/>`;
    svg += `<text class="axis" x="${pad.l - 8}" y="${y(v) + 4}" text-anchor="end">${v}</text>`;
  }
  // Date labels: start, middle and end (fewer when the chart is narrow)
  const manyYears = new Date(startN * 86400000).getUTCFullYear() !== new Date(endN * 86400000).getUTCFullYear();
  // The middle label is the real day nearest the middle of the chart.
  const midN = anchors.reduce((best, n) => Math.abs(vAt.get(n) - span / 2) < Math.abs(vAt.get(best) - span / 2) ? n : best, anchors[0]);
  const ticks = span < 2 ? [endN] : (W < 400 || midN === startN || midN === endN ? [startN, endN] : [startN, midN, endN]);
  // Squeezed gaps: a light band with "…" so you can see that time was skipped.
  for (const g of gaps) {
    const gx = pad.l + (g.v / span) * (W - pad.l - pad.r), gw = Math.max(6, (GAP_W / span) * (W - pad.l - pad.r) * 0.6);
    const yrs = (g.to - g.from) / 365.25;
    const label = yrs >= 1 ? `${yrs.toFixed(yrs < 10 ? 1 : 0)} years with no moods` : `${Math.round((g.to - g.from) / 30.4)} months with no moods`;
    svg += `<rect class="gap-band" x="${gx - gw / 2}" y="${pad.t}" width="${gw}" height="${H - pad.t - pad.b}"><title>${label}</title></rect>`;
    svg += `<text class="axis" x="${gx}" y="${pad.t + 10}" text-anchor="middle">…</text>`;
  }
  ticks.forEach((n, i) => {
    const iso = new Date(n * 86400000).toISOString().slice(0, 10);
    const anchor = ticks.length === 1 ? "middle" : i === 0 ? "start" : i === ticks.length - 1 ? "end" : "middle";
    const label = manyYears ? prettyDate(iso, { month: "short", day: "numeric", year: "numeric" }) : shortDate(iso);
    svg += `<text class="axis" x="${span < 2 ? (W + pad.l - pad.r) / 2 : x(n)}" y="${H - 8}" text-anchor="${anchor}">${label}</text>`;
  });
  svg += `<line class="avg-line" x1="${pad.l}" x2="${W - pad.r}" y1="${y(avg)}" y2="${y(avg)}"/>`;
  const px = m => (span < 2 && pts.length === 1 ? (W + pad.l - pad.r) / 2 : x(dayNum(m.date)));
  // The line breaks at a squeezed gap; a dashed line joins the two sides.
  if (pts.length > 1) {
    let d = "";
    pts.forEach((m, i) => {
      const brk = i && isGap(dayNum(pts[i - 1].date), dayNum(m.date));
      if (brk) svg += `<line class="gap-join" x1="${px(pts[i - 1]).toFixed(1)}" y1="${y(pts[i - 1].score).toFixed(1)}" x2="${px(m).toFixed(1)}" y2="${y(m.score).toFixed(1)}"/>`;
      d += `${!i || brk ? "M" : "L"}${px(m).toFixed(1)},${y(m.score).toFixed(1)}`;
    });
    svg += `<path class="trend-line" d="${d}"/>`;
  }
  const r = pts.length > 60 ? 3 : 4.5;
  for (const m of pts) svg += `<circle class="dot" cx="${px(m)}" cy="${y(m.score)}" r="${r}" fill="${moodColor(m.score)}"/>`;
  svg += `<line class="cross hidden" y1="${pad.t}" y2="${H - pad.b}"/><rect class="hit" x="0" y="0" width="${W}" height="${H}"/></svg>`;
  trendEl.innerHTML = svg + `<div class="tip hidden"></div>`;

  // Hover / tap: show the closest day
  const svgEl = trendEl.querySelector("svg");
  const cross = svgEl.querySelector(".cross");
  const tip = trendEl.querySelector(".tip");
  const show = ev => {
    const box = svgEl.getBoundingClientRect();
    const mx = ((ev.clientX - box.left) / box.width) * W;
    let best = pts[0];
    for (const m of pts) if (Math.abs(px(m) - mx) < Math.abs(px(best) - mx)) best = m;
    const bx = px(best);
    cross.setAttribute("x1", bx); cross.setAttribute("x2", bx);
    cross.classList.remove("hidden");
    tip.innerHTML = `<strong>${best.score}/10</strong> · ${escapeHTML(prettyDate(best.date, { weekday: "short", month: "short", day: "numeric", ...(best.date.slice(0, 4) !== today.slice(0, 4) ? { year: "numeric" } : {}) }))}` +
      "";
    tip.classList.remove("hidden");
    const left = (bx / W) * box.width;
    tip.style.left = Math.min(Math.max(left, 70), box.width - 70) + "px";
    tip.style.top = Math.max(0, (y(best.score) / H) * box.height - 12) + "px";
  };
  const hide = () => { cross.classList.add("hidden"); tip.classList.add("hidden"); };
  svgEl.addEventListener("pointermove", show);
  svgEl.addEventListener("pointerdown", show);
  svgEl.addEventListener("pointerleave", hide);

  const hi = Math.max(...pts.map(m => m.score)), lo = Math.min(...pts.map(m => m.score));
  trendStats.textContent = `Average ${avg.toFixed(1)} / 10 (dashed line) · ${pts.length} day${pts.length > 1 ? "s" : ""} logged · Highest ${hi} · Lowest ${lo}`;
}

// When the app runs as a claude.ai page, downloads go through the page's "downloads" helper.
let claudeDownloads = null;
if (window.claude && typeof window.claude.use === "function") {
  window.claude.use("downloads").then(d => { claudeDownloads = d; }).catch(() => {});
}

// Save a file to the device. Returns true when it was saved.
async function saveFile(filename, text, mime) {
  if (claudeDownloads) {
    try {
      await claudeDownloads.save({ filename, data: text });
      return true;
    } catch (err) {
      if (err && err.code !== "declined") toast("Could not save the file here.", 4000);
      return false;
    }
  }
  const blob = text instanceof Blob ? text : new Blob([text], { type: mime });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  return true;
}

// The whole app's data for a backup file, with the photos inside it.
async function backupData() {
  const photos = {};
  let missing = 0;
  for (const id of photoRefsOf(journal, trash)) {
    const d = await photoData(id);
    if (d) photos[id] = d; else missing++;
  }
  return { data: { app: "mind-tracker", version: 4, exported: new Date().toISOString(), journal, moods, reminders, customTags, pendingDays, missedDays, trash, prefs, photos }, missing };
}
// Keep the photos from a backup file on this device (only the ones its entries use).
async function importPhotos(photos, js, tr) {
  if (!photos || typeof photos !== "object") photos = {};
  const map = new Map();
  let n = 0;
  for (const id of photoRefsOf(js, tr)) {
    const d = photos[id], aid = assetIdOf(id);
    if (aid && (await photoAssetsReady) && !(await assetGone(aid))) { n++; continue; } // still in file storage
    if (!ID_RE.test(id) || !isPhotoData(d)) continue;
    let nid = await photoToAssets(d);
    if (!nid) { nid = aid ? "p" + uid() : id; await photoPutLocal(nid, d); }
    if (nid !== id) map.set(id, nid);
    n++;
  }
  // Point the entries at the new ids.
  const swap = e => { if (e && Array.isArray(e.photos)) e.photos = e.photos.map(x => map.get(x) || x); };
  (js || []).forEach(swap);
  (tr || []).forEach(t => t && t.kind === "j" && swap(t.item));
  return n;
}
// After a backup is loaded: every photo it uses must be online too.
function photosAfterImport() {
  const ob = photoOutbox();
  for (const id of photoRefsOf(journal, trash)) if (!assetIdOf(id) && !ob.up.includes(id)) ob.up.push(id);
  saveLocal("mt_photo_outbox", ob);
  photoRefsLater(true);
}
