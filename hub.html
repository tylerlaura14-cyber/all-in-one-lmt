// ---------- PDF export ----------
// The PDF library (jsPDF, MIT license, in vendor/) is only loaded when you export.
let jsPDFLoading = null;
function loadJsPDF() {
  if (window.jspdf && window.jspdf.jsPDF) return Promise.resolve(window.jspdf.jsPDF);
  if (!jsPDFLoading) {
    jsPDFLoading = new Promise((resolve, reject) => {
      const sc = document.createElement("script");
      sc.src = "vendor/jspdf.umd.min.js";
      sc.onload = () => (window.jspdf && window.jspdf.jsPDF ? resolve(window.jspdf.jsPDF) : reject(new Error("no jsPDF")));
      sc.onerror = () => { jsPDFLoading = null; reject(new Error("load failed")); };
      document.head.appendChild(sc);
    });
  }
  return jsPDFLoading;
}
// PDF built-in fonts only have Western letters, so other characters are swapped or left out.
const CP1252_EXTRA = "€‚ƒ„…†‡ˆ‰Š‹ŒŽ‘’“”•–—˜™š›œžŸ";
const PDF_SWAP = { "→": "->", "←": "<-", "★": "*", "☆": "*", "✓": "v", "✔": "v", "✗": "x", "✕": "x", "…": "...", " ": " " };
function pdfSafe(str) {
  let out = "";
  for (const ch of String(str).normalize("NFC")) {
    const c = ch.codePointAt(0);
    if (ch in PDF_SWAP) out += PDF_SWAP[ch];
    else if (c === 10) out += "\n";
    else if (c === 9) out += "    ";
    else if (c < 32 || (c >= 127 && c < 160)) continue;
    else if (c < 256 || CP1252_EXTRA.includes(ch)) out += ch;
    // emojis, joiners and variation selectors are left out; other letters become "?"
    else if (c >= 0x1f000 || (c >= 0x2190 && c <= 0x2bff) || (c >= 0xfe00 && c <= 0xfe0f) || c === 0x200d || (c >= 0xe0000)) continue;
    else out += "?";
  }
  return out;
}
function hslToRgb(hsl) {
  const [h, s, l] = hsl.match(/[\d.]+/g).map(Number);
  const S = s / 100, L = l / 100, k = n => (n + h / 30) % 12, a = S * Math.min(L, 1 - L);
  const f = n => Math.round(255 * (L - a * Math.max(-1, Math.min(k(n) - 3, Math.min(9 - k(n), 1)))));
  return [f(0), f(8), f(4)];
}
function hexToRgb(hex) {
  const m = /^#?([0-9a-f]{6})$/i.exec(hex.trim());
  return m ? [0, 2, 4].map(i => parseInt(m[1].slice(i, i + 2), 16)) : [124, 108, 242];
}

document.getElementById("expPdf").addEventListener("click", async () => {
  const x = exportData();
  if (!x) return;
  const btn = document.getElementById("expPdf");
  btn.disabled = true;
  btn.textContent = "Making PDF…";
  try {
    const JsPDF = await loadJsPDF();
    const doc = new JsPDF({ unit: "pt", format: "letter" });
    const W = doc.internal.pageSize.getWidth(), H = doc.internal.pageSize.getHeight();
    const M = 54, CW = W - M * 2, BOTTOM = H - 54;
    const accent = hexToRgb(getComputedStyle(document.documentElement).getPropertyValue("--primary") || "#7c6cf2");
    const INK = [34, 34, 46], MUTED = [110, 110, 125], LINE = [222, 222, 232], SOFT = [246, 245, 250];
    const rangeText = `${prettyDate(x.from, { month: "short", day: "numeric", year: "numeric" })} – ${prettyDate(x.to, { month: "short", day: "numeric", year: "numeric" })}`;
    let y = M;

    const setText = (size, style = "normal", color = INK) => { doc.setFont("helvetica", style); doc.setFontSize(size); doc.setTextColor(...color); };
    const newPage = () => { doc.addPage(); y = M; };
    const need = h => { if (y + h > BOTTOM) newPage(); };
    // Write wrapped text, moving to a new page when needed.
    const para = (text, size, style, color, indent = 0, gap = 1.45) => {
      setText(size, style, color);
      const lh = size * gap;
      for (const ln of doc.splitTextToSize(pdfSafe(text), CW - indent)) {
        need(lh);
        doc.text(ln, M + indent, y + size * 0.8);
        y += lh;
      }
    };
    const pill = (label, rgb, px, py) => {
      setText(10, "bold", [255, 255, 255]);
      const w = doc.getTextWidth(label) + 14;
      doc.setFillColor(...rgb);
      doc.roundedRect(px, py, w, 16, 8, 8, "F");
      doc.text(label, px + 7, py + 11.5);
      return w;
    };

    // --- Cover: title and summary ---
    doc.setFillColor(...accent);
    doc.rect(0, 0, W, 6, "F");
    setText(24, "bold", accent);
    doc.text("Mind Tracker", M, y + 22);
    y += 32;
    setText(12, "normal", MUTED);
    doc.text(pdfSafe(`Journal and moods · ${rangeText}`), M, y + 10);
    y += 18;
    doc.text(pdfSafe(`Made on ${prettyDate(todayISO(), { month: "long", day: "numeric", year: "numeric" })}`), M, y + 10);
    y += 30;

    const rated = x.rated;
    const entryCount = x.days.reduce((n, d) => n + d.entries.length, 0);
    const tiles = [
      ["Average mood", x.avg ? `${x.avg} / 10` : "–"],
      ["Days with a mood", String(x.moodDays)],
      ["Journal entries", String(entryCount)],
    ];
    const tw = (CW - 16) / 3;
    tiles.forEach(([label, val], i) => {
      const tx = M + i * (tw + 8);
      doc.setFillColor(...SOFT); doc.setDrawColor(...LINE);
      doc.roundedRect(tx, y, tw, 54, 6, 6, "FD");
      setText(18, "bold", INK); doc.text(pdfSafe(val), tx + 12, y + 26);
      setText(9, "normal", MUTED); doc.text(label, tx + 12, y + 42);
    });
    y += 66;
    if (rated.length) {
      const best = rated.reduce((a, m) => (m.score > a.score ? m : a));
      const worst = rated.reduce((a, m) => (m.score < a.score ? m : a));
      para(`Best day: ${prettyDate(best.date, { weekday: "short", month: "short", day: "numeric" })} (${best.score}/10)    Hardest day: ${prettyDate(worst.date, { weekday: "short", month: "short", day: "numeric" })} (${worst.score}/10)`, 10, "normal", MUTED);
    }

/* ---------- Weekly summary (last 7 days compared with the 7 before) ---------- */
const weekEl = document.getElementById("weekSummary");
function renderWeek() {
  const t = dayNum(todayISO());
  const inDays = (m, a, b) => { const n = dayNum(m.date); return n >= a && n <= b; };
  const thisWeek = ratedMoods().filter(m => inDays(m, t - 6, t)).sort((a, b) => a.date.localeCompare(b.date));
  const entries = journal.filter(e => { const n = dayNum(e.date); return n >= t - 6 && n <= t; }).length;
  if (!thisWeek.length) {
    weekEl.innerHTML = `<p class="hint" style="margin:0">No moods logged in the last 7 days yet. Log one in the form below.</p>`;
    return;
  }
  const avg = arr => arr.reduce((s, m) => s + m.score, 0) / arr.length;
  // Average mood: this calendar month, compared with last month.
  const ym = todayISO().slice(0, 7);
  const [yy, mm] = ym.split("-").map(Number);
  const prevYm = mm === 1 ? `${yy - 1}-12` : `${yy}-${String(mm - 1).padStart(2, "0")}`;
  const thisMonth = ratedMoods().filter(m => m.date.slice(0, 7) === ym && m.date <= todayISO());
  const lastMonth = ratedMoods().filter(m => m.date.slice(0, 7) === prevYm);
  const monthName = ym2 => new Date(Number(ym2.slice(0, 4)), Number(ym2.slice(5)) - 1, 1).toLocaleDateString(undefined, { month: "long" });
  const a = thisMonth.length ? avg(thisMonth) : null;
  let change = "";
  if (thisMonth.length && lastMonth.length) {
    const diff = a - avg(lastMonth);
    change = Math.abs(diff) < 0.1 ? `Same as ${monthName(prevYm)}`
      : `${diff > 0 ? "▲ Up" : "▼ Down"} ${Math.abs(diff).toFixed(1)} from ${monthName(prevYm)}`;
  }
  const best = thisWeek.reduce((x, m) => (m.score > x.score ? m : x));
  const worst = thisWeek.reduce((x, m) => (m.score < x.score ? m : x));
  const counts = new Map();
  for (const m of thisWeek) for (const tg of m.tags) counts.set(tg, (counts.get(tg) || 0) + 1);
  const topTags = [...counts].sort((x, y) => y[1] - x[1]).slice(0, 3);
  const dayName = d => prettyDate(d, { weekday: "short", month: "short", day: "numeric" });
  weekEl.innerHTML = `
    <div class="week-tiles">
      <div class="tile"><div class="tile-num" style="${a === null ? "" : `color:${moodColor(Math.round(a))}`}">${a === null ? "–" : a.toFixed(1)}</div><div class="tile-label">Average mood · ${monthName(ym)}</div>${change ? `<div class="tile-sub">${change}</div>` : ""}</div>
      <div class="tile"><div class="tile-num">${thisWeek.length}<small>/7</small></div><div class="tile-label">Days logged</div></div>
    </div>
    <ul class="week-list">
      <li><span>Best day</span><strong>${dayName(best.date)} · ${best.score}/10</strong></li>
      ${worst.date !== best.date ? `<li><span>Hardest day</span><strong>${dayName(worst.date)} · ${worst.score}/10</strong></li>` : ""}
    </ul>`;
}

// Arrow keys move between choices in a group (like radio buttons).
function radioKeys(group, sel, pick) {
  group.addEventListener("keydown", ev => {
    const keys = { ArrowRight: 1, ArrowDown: 1, ArrowLeft: -1, ArrowUp: -1 };
    if (!(ev.key in keys)) return;
    const items = [...group.querySelectorAll(sel)];
    const i = items.indexOf(document.activeElement);
    if (i < 0) return;
    ev.preventDefault();
    const next = items[(i + keys[ev.key] + items.length) % items.length];
    pick(next);
    group.querySelector(`${sel}[aria-checked="true"]`)?.focus();
  });
}

function setPref(key, value) {
  prefs = { ...prefs, [key]: value };

let binAsking = false;
async function pickBin(b) {
  const days = Number(b.dataset.binDays);
  if (days === prefs.binDays || binAsking) return;
  // A shorter time can remove items now: ask first.
  const vis = a => a.filter(t => t.kind !== "r").length;
  const lost = vis(trash) - vis(cleanTrash(trash, days));
  const anyLost = trash.length !== cleanTrash(trash, days).length;
  if (lost) {
    binAsking = true;
    const ok = await askConfirm(`${lost} ${lost === 1 ? "item in the bin is" : "items in the bin are"} older than ${days} days. ${lost === 1 ? "It" : "They"} will be deleted for good now.`, "Delete and change");
    binAsking = false;
    if (!ok) { binSeg.querySelector('[aria-checked="true"]')?.focus(); return; }
  }
  setPref("binDays", days);
  if (anyLost) { trash = cleanTrash(trash); save(KEYS.trash, trash); }
  renderBin();
  renderSettings();
  binSeg.querySelector('[aria-checked="true"]')?.focus();
}
for (const [group, attr, pick] of [[startSeg, "data-start", pickStart], [backupSeg, "data-backup-days", pickBackup], [binSeg, "data-bin-days", pickBin]]) {
  group.addEventListener("click", ev => { const b = ev.target.closest(`[${attr}]`); if (b) { pick(b); if (pick !== pickBin) b.focus(); } });
  radioKeys(group, `[${attr}]`, pick);
}

/* ---------- Recycle bin ---------- */
const binCount = document.getElementById("binCount");
const binList = document.getElementById("binList");
const binEmpty = document.getElementById("binEmpty");
function moveToBin(kind, item) {
  const deletedAt = Date.now();
  const key = kind === "m" ? item.date : item.id;
  const tid = `${kind}_${key}_${deletedAt}`;
  trash.push({ tid, kind, item: JSON.parse(JSON.stringify(item)), deletedAt });
  save(KEYS.trash, trash);
  return tid;
}
function removeFromBin(tid) {
  trash = trash.filter(t => t.tid !== tid);
  save(KEYS.trash, trash);
  renderBin();
}
function renderBin() {
  document.getElementById("binDaysText").textContent = prefs.binDays;
  const items = trash.filter(t => t.kind !== "r").sort((a, b) => b.deletedAt - a.deletedAt);
  binCount.textContent = items.length ? String(items.length) : "";
  binEmpty.classList.toggle("hidden", !items.length);
  if (!items.length) { binList.innerHTML = `<p class="empty" style="padding:8px">The bin is empty.</p>`; return; }
  const ago = ms => { const d = Math.floor((Date.now() - ms) / 86400000); return d <= 0 ? "today" : d === 1 ? "yesterday" : `${d} days ago`; };
  const left = ms => Math.max(0, prefs.binDays - Math.floor((Date.now() - ms) / 86400000));
  binList.innerHTML = items.map(t => {
    const it = t.item;
    const when = prettyDate(it.date || todayISO(), { weekday: "short", month: "short", day: "numeric" });
    const what = t.kind === "j"
      ? `📓 <strong>${escapeHTML(it.title || "Journal entry")}</strong> · ${when}<br><span class="bin-snippet">${escapeHTML(it.text.length > 110 ? it.text.slice(0, 110) + "…" : it.text)}</span>`
      : `🌈 <strong>Mood ${it.score}/10</strong> · ${when}`;
    return `
      <div class="bin-item">
        <div class="bin-text">${what}<br><small>Deleted ${ago(t.deletedAt)} · removed for good in ${left(t.deletedAt)} days</small></div>
        <div class="therapy-btns">
          <button type="button" class="btn ghost small" data-restore="${t.tid}">Restore</button>
          <button type="button" class="btn danger small" data-purge="${t.tid}" aria-label="Delete for good">Delete</button>
        </div>
      </div>`;
  }).join("");
}
binList.addEventListener("click", async ev => {
  const b = ev.target.closest("button");
  if (!b) return;
  const t = trash.find(x => x.tid === (b.dataset.restore || b.dataset.purge));
  if (!t) return renderBin();
  if (b.dataset.purge) {
    if (!await askChoice("Delete this for good? It cannot be brought back.", [{ value: false, label: "Cancel" }, { value: true, label: "Delete for good", danger: true }])) return;
    removeFromBin(t.tid);
    return;
  }
  // Restore
  const it = t.item;
  if (t.kind === "j") {
    if (!journal.some(x => x.id === it.id)) journal.push(it);
    save(KEYS.journal, journal);
    syncAutoMood(it.date);
  } else if (t.kind === "m") {
    const now = moods.find(x => x.date === it.date);
    if (now && !await askChoice(`${prettyDate(it.date)} already has a mood (${now.score}/10). Replace it with ${it.score}/10?`,
      [{ value: false, label: "Keep the current one" }, { value: true, label: "Replace", primary: true }])) return;
    moods = moods.filter(x => x.date !== it.date);
    moods.push(it);
    save(KEYS.mood, moods);
    if (!it.auto) markRated(it.date);
  }
  removeFromBin(t.tid);
  renderAll();
  toast(t.kind === "j" ? "Entry restored." : "Mood restored.", 2500);
});
binEmpty.addEventListener("click", async () => {
  const shown = trash.filter(t => t.kind !== "r").length; // old reminders are hidden, and go with the rest
  if (!trash.length) return;
  if (!await askChoice(`Delete all ${shown} item${shown === 1 ? "" : "s"} in the bin for good? They cannot be brought back.`,
    [{ value: false, label: "Cancel" }, { value: true, label: "Empty the bin", danger: true }])) return;
  trash = [];
  save(KEYS.trash, trash);
  renderBin();
  toast("Recycle bin emptied.", 2500);
});

;
// Sync between devices.
// Only works when the app is opened from its claude.ai link. Data goes to your
// own private space there ("data/users/<your id>"), which only you can read.
// Elsewhere (for example a saved copy of the file), the app keeps data on this device only.
//
// How it works:
// - Each journal entry, mood day and reminder is one record ("document").
// - When you save, only the records that changed are sent.
// - When another device changes something, this device gets the change and redraws.
// - The first time a device syncs, it adds its own data to your account
//   (so nothing on an older device is lost). After that, your account is the main copy.
// - Changes made before sync connects, and saves that failed, are kept as a list of
//   records ("dirty") and put on top of the server copy, so they are never lost or undone.
// - If a different person's account opens the app in this browser, the data saved here
//   belongs to someone else, so it is not uploaded to the new account.

(function () {
  if (!window.claude || typeof window.claude.use !== "function") return;

  const statusEl = document.getElementById("syncStatus");
  const backupHint = document.getElementById("backupHint");
  const KIND = { [KEYS.journal]: "j_", [KEYS.mood]: "m_", [KEYS.reminders]: "r_", [KEYS.tags]: "settings", [KEYS.lastBackup]: "settings",
    [KEYS.pending]: "settings", [KEYS.missed]: "settings", [KEYS.prefs]: "settings", [KEYS.trash]: "t_" };

  let col = null;          // your private collection
  let photoCol = null;     // your private photos (one record per photo, read only when needed)
  let ready = false;       // true after the first full answer from the server
  let firstSyncKey = "";   // remembers that this device already did its first sync
  let remote = new Map();  // record id -> stable JSON text, as the server has it
  let lastSnap = null;     // newest server answer not yet shown (while saves are running)
  let pending = 0;         // saves still running
  let failed = false;      // the last save did not reach the server
  let stopped = false;     // the live connection ended
  let replaceAllPending = false;  // a backup was loaded before sync connected
  let myId = "";
  const dirty = new Map();        // record id -> record (or null = deleted) not yet confirmed by the server
  const chains = new Map();       // record id -> running save (one at a time per record)

  function setStatus(text, cls) {
    statusEl.textContent = text;
    statusEl.className = "sync " + (cls || "");
  }
  function showStatus() {
    if (failed || stopped) return setStatus("⚠️ Sync problem. Your changes are saved on this device.", "warn");
    if (!ready) return setStatus("☁️ Connecting to sync…");
    setStatus(pending ? "☁️ Saving…" : "☁️ Synced across your devices", pending ? "" : "ok");
  }

  // JSON with sorted keys, so the same data always gives the same text.
  function stable(v) {
    if (Array.isArray(v)) return "[" + v.map(stable).join(",") + "]";
    if (v && typeof v === "object") {
      return "{" + Object.keys(v).sort().filter(k => v[k] !== undefined)
        .map(k => JSON.stringify(k) + ":" + stable(v[k])).join(",") + "}";
    }
    return JSON.stringify(v);
  }

  // The records this device wants on the server, for one data kind.
  function wanted(key) {
    const out = new Map();
    if (key === KEYS.journal) for (const e of journal) out.set("j_" + e.id, e);
    if (key === KEYS.mood) for (const m of moods) out.set("m_" + m.date, m);
    if (key === KEYS.reminders) for (const r of reminders) out.set("r_" + r.id, r);
    if (key === KEYS.trash) for (const t of trash) out.set("t_" + t.tid, t);
    if (KIND[key] === "settings") out.set("settings", { customTags, lastBackup, pendingDays, missedDays, prefs });
    return out;
  }
  function allWanted() {
    const out = new Map();
    for (const k of [KEYS.journal, KEYS.mood, KEYS.reminders, KEYS.tags, KEYS.trash]) for (const [id, b] of wanted(k)) out.set(id, b);
    return out;
  }
  // This device's data when the page opened, before any change made now.
  const baseline = new Map([...allWanted()].map(([id, b]) => [id, stable(b)]));

  // The list of changes that the server does not have yet is also kept on this device.
  // So a change made with no connection, or a save that failed, is still sent after the page is closed and opened again.
  const DIRTY_KEY = "mt_unsynced", REPLACE_KEY = "mt_replace_all";
  const carried = new Set(); // ids that were already waiting when the page opened
  function keepDirty() {
    try { localStorage.setItem(DIRTY_KEY, JSON.stringify([...dirty].map(([id, b]) => [id, b ? 1 : 0]))); } catch {}
  }
  try {
    const saved = JSON.parse(localStorage.getItem(DIRTY_KEY) || "[]");
    const have = allWanted();
    for (const pair of Array.isArray(saved) ? saved : []) {
      const id = Array.isArray(pair) && typeof pair[0] === "string" ? pair[0] : "";
      if (!id) continue;
      if (!pair[1]) { if (!have.has(id)) { dirty.set(id, null); carried.add(id); } }
      else if (have.has(id)) { dirty.set(id, have.get(id)); carried.add(id); }
    }
    replaceAllPending = localStorage.getItem(REPLACE_KEY) === "1";
  } catch {}

  const wait = ms => new Promise(r => setTimeout(r, ms));
  function write(id, body) {
    dirty.set(id, body);
    keepDirty();
    pending++;
    showStatus();
    // Send a copy: the record itself can change again while this save is running.
    const sent = body ? JSON.parse(JSON.stringify(body)) : null;
    const text = sent ? stable(sent) : null;
    const op = () => (sent ? col.doc(id).set(sent) : col.doc(id).delete());
    const prev = chains.get(id) || Promise.resolve();
    // Try again once, after a short wait, if the server is briefly busy.
    const run = prev.then(op).catch(err => {
      if (err && err.code === "unavailable") return wait(1000 + Math.random() * 2000).then(op);
      throw err;
    });
    const done = run.then(
      () => {
        if (sent) remote.set(id, text); else remote.delete(id);
        // Confirmed, unless the record changed again meanwhile.
        if (dirty.has(id)) { const now = dirty.get(id); if ((now ? stable(now) : null) === text) { dirty.delete(id); keepDirty(); } }
        failed = false;
      },
      err => {
        failed = true;
        if (err && err.code === "quota_exceeded") toast("Sync storage is full. Delete some old entries, or save a backup file.", 8000);
      },
    ).finally(() => {
      pending--;
      if (chains.get(id) === done) chains.delete(id);
      if (!pending && lastSnap) { const s = lastSnap; lastSnap = null; apply(s); }
      showStatus();
    });
    chains.set(id, done);
  }

  // Send the changes for one data kind.
  function push(key) {
    const prefix = KIND[key];
    if (!prefix) return;
    const want = wanted(key);
    if (!col || !ready) {
      // Not connected yet: remember exactly which records changed or were deleted.
      for (const [id, body] of want) {
        if (baseline.get(id) !== stable(body) || carried.has(id)) dirty.set(id, body);
        else dirty.delete(id);
      }
      for (const id of [...baseline.keys(), ...dirty.keys()]) {
        if (id.startsWith(prefix) && !want.has(id)) {
          if (baseline.has(id) || carried.has(id)) dirty.set(id, null); else dirty.delete(id);
        }
      }
      keepDirty();
      return;
    }
    for (const [id, body] of want) {
      if (remote.get(id) !== stable(body)) write(id, body);
    }
    if (prefix !== "settings") {
      for (const id of [...remote.keys()]) {
        if (id.startsWith(prefix) && !want.has(id)) write(id, null);
      }
    }
  }

  function apply(snap) {
    if (pending) { lastSnap = snap; return; } // wait so a running save does not flicker back
    const docs = snap.docs.filter(d => d.exists);
    remote = new Map(docs.map(d => [d.id, stable(d.data())]));
    const rmap = new Map(docs.map(d => [d.id, d.data()]));
    let otherOwner = false;

    if (!ready) {
      // Was this browser's data saved by a different account?
      let savedOwner = load("mt_owner", "");
      if (!savedOwner) {
        try {
          for (let i = 0; i < localStorage.length; i++) {
            const k = localStorage.key(i);
            if (k && k.startsWith("mt_synced_") && k !== firstSyncKey) savedOwner = k.slice(10);
          }
        } catch {}
      }
      otherOwner = !!savedOwner && savedOwner !== myId;
      const firstTime = !load(firstSyncKey, false) && !otherOwner;

      if (replaceAllPending) {
        // A backup was loaded before sync connected: it replaces everything.
        rmap.clear();
        for (const [id, b] of allWanted()) rmap.set(id, b);
      } else if (otherOwner) {
        dirty.clear(); // someone else's data: do not upload it
        try { localStorage.removeItem("mt_photo_expired"); } catch {}
        carried.clear();
      } else if (firstTime) {
        // First sync on this device: add what this device has that the account does not.
        const texts = new Set(docs.filter(d => d.id.startsWith("r_")).map(d => String(d.data().text || "").trim().toLowerCase()));
        for (const [id, b] of allWanted()) {
          if (rmap.has(id)) continue;
          if (id.startsWith("r_") && texts.has(b.text.trim().toLowerCase())) continue; // same reminder already there
          rmap.set(id, b);
        }
        const rs = rmap.get("settings") || {};
        rmap.set("settings", {
          customTags: cleanTags([...(Array.isArray(rs.customTags) ? rs.customTags : []), ...customTags]),
          lastBackup: [rs.lastBackup, lastBackup].filter(x => DATE_RE.test(x)).sort().pop() || "",
          pendingDays: cleanDates([...(Array.isArray(rs.pendingDays) ? rs.pendingDays : []), ...pendingDays]),
          missedDays: cleanDates([...(Array.isArray(rs.missedDays) ? rs.missedDays : []), ...missedDays]),
          prefs: rs.prefs ? cleanPrefs(rs.prefs) : prefs, // the account's settings win; else this device's
        });
      }
    }
    // Changes not yet confirmed by the server (made before connecting, or a failed save) stay on top.
    if (!otherOwner) for (const [id, b] of dirty) { if (b) rmap.set(id, b); else rmap.delete(id); }

    const pick = prefix => [...rmap].filter(([id]) => id.startsWith(prefix)).map(([, b]) => b);
    const rJournal = cleanJournal(pick("j_"));
    const rMoods = cleanMoods(pick("m_"));
    const rReminders = cleanReminders(pick("r_"));
    const settings = rmap.get("settings") || {};
    // Older synced data has no settings yet: keep this device's.
    const rPrefs = settings.prefs ? cleanPrefs(settings.prefs) : prefs;
    const rTrash = cleanTrash(pick("t_"), rPrefs.binDays);
    const rTags = cleanTags(settings.customTags);
    const rLastBackup = DATE_RE.test(settings.lastBackup) ? settings.lastBackup : "";
    const rPending = cleanDates(settings.pendingDays);
    const rMissed = cleanDates(settings.missedDays);

    journal = rJournal;
    moods = rMoods;
    reminders = rReminders;
    trash = rTrash;
    prefs = rPrefs;
    customTags = rTags;
    lastBackup = rLastBackup;
    pendingDays = rPending;
    missedDays = rMissed;
    saveLocal(KEYS.journal, journal);
    saveLocal(KEYS.mood, moods);
    saveLocal(KEYS.reminders, reminders);
    saveLocal(KEYS.trash, trash);
    saveLocal(KEYS.prefs, prefs);
    saveLocal(KEYS.tags, customTags);
    saveLocal(KEYS.lastBackup, lastBackup);
    saveLocal(KEYS.pending, pendingDays);
    saveLocal(KEYS.missed, missedDays);

    saveLocal("mt_owner", myId);

    if (!ready) {
      ready = true;
      replaceAllPending = false;
      try { localStorage.removeItem(REPLACE_KEY); } catch {}
      saveLocal(firstSyncKey, true);
      dirty.clear(); // push() below works out again what the server is missing
      carried.clear();
      keepDirty();
      // Send anything this device had that the account did not.
      push(KEYS.journal); push(KEYS.mood); push(KEYS.reminders); push(KEYS.tags); push(KEYS.trash);
      photoSyncReady();
    } else {
      // Try failed saves again.
      for (const [id, b] of [...dirty]) if (!chains.has(id)) write(id, b);
    }
    if (ready) photoRefsLater(false); // entries changed on another device
    renderAll();
    showStatus();
  }

  window.MTSync = {
    push,
    active: () => ready,
    photos: () => (ready && photoCol) || null,
    replaceAll: () => { if (!ready) { replaceAllPending = true; try { localStorage.setItem(REPLACE_KEY, "1"); } catch {} } },
  };

  (async () => {
    const [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
    if (!db || !user) return; // sync not available here: stay on this device only
    const id = await user.id();
    if (!id) return;
    myId = id;
    try {
      col = db.collection("data/users/" + id);
      photoCol = db.collection("data/users/" + id + "/media/photos");
    } catch {
      return;
    }
    firstSyncKey = "mt_synced_" + id;
    statusEl.classList.remove("hidden");
    backupHint.textContent = "Your data syncs to your private claude.ai space. A backup file is still a good extra copy.";
    showStatus();

    const slow = setTimeout(() => {
      if (!ready) setStatus("⚠️ Can't reach sync right now. Your changes are saved on this device.", "warn");
    }, 10000);

    col.onSnapshot(
      snap => {
        if (!ready && snap.metadata.fromCache) return; // wait for a full answer before the first join
        clearTimeout(slow);
        apply(snap);
      },
      err => {
        clearTimeout(slow);
        stopped = true;
        showStatus();
        if (err && err.code !== "revoked") console.warn("Sync stopped:", err.code);
      },

  })().catch(() => {});
})();

;

  matches: d => !!d && d.app === "mind-tracker" && Array.isArray(d.journal) && Array.isArray(d.moods),
  // _missing = photos not on this device (the hub warns about them, then removes the field).
  exportData: async () => { const r = await backupData(); return { ...r.data, _missing: r.missing }; },

      customTags: cleanTags(data.customTags), prefs: data.prefs ? cleanPrefs(data.prefs) : prefs,

    prefs = c.prefs; pendingDays = c.pendingDays; missedDays = c.missedDays; trash = c.trash;
    save(KEYS.journal, journal); save(KEYS.mood, moods); save(KEYS.reminders, reminders); save(KEYS.tags, customTags);
    save(KEYS.prefs, prefs); save(KEYS.pending, pendingDays); save(KEYS.missed, missedDays); save(KEYS.trash, trash);

  },
});

    h += `<th class="daycol ${d.date === t ? 'today' : ''}"><button class="daybtn" data-day="${esc(d.id)}" aria-label="Change ${longDate(d.date)}"><span class="num">${Number(d.date.slice(8))}</span>${wd}</button></th>`;
  });
  h += '</tr></thead><tbody>';
  data.groups.forEach(g => {
    h += `<tr><td class="rowhead">${esc(g.name)}</td>`;
    days.forEach(d => {
      const m = data.marks[d.id + ':' + g.id] || '';
      const sym = m === 'done' ? '✓' : m === 'skip' ? '✗' : '';
      h += `<td class="cell ${d.date === t ? 'today' : ''}"><button class="${esc(m)}" data-k="${esc(d.id)}:${esc(g.id)}" aria-label="${esc(g.name)} ${shortDate(d.date)}">${sym}</button></td>`;
    });
    h += '</tr>';
  });
  grid.innerHTML = h + '</tbody>';
  grid.querySelectorAll('button.daybtn').forEach(b => b.onclick = () => {
    const day = data.days.find(d => d.id === b.dataset.day);
    if (day) editDay(day);
  });
  grid.querySelectorAll('td.cell button').forEach(b => b.onclick = () => {
    const k = b.dataset.k, cur = data.marks[k];
    if (!cur) data.marks[k] = 'done';
    else if (cur === 'done') data.marks[k] = 'skip';
    else delete data.marks[k];

}

function renderStats() {
  let done = 0, total = 0;
  monthDays().forEach(d => data.groups.forEach(g => {
    const m = data.marks[d.id + ':' + g.id];
    if (m) total++; // a ✓ or ✗ box; empty boxes do not count
    if (m === 'done') done++;
  }));
  const t = todayISO();
  let streak = 0;
  const past = data.days.filter(d => d.date <= t).sort((a, b) => a.date < b.date ? -1 : 1);
  // Count back day by day from today (or yesterday, while today is not finished). A missing day breaks it.
  let expect = t;
  for (let i = past.length - 1; i >= 0; i--) {
    const d = past[i];
    const all = data.groups.length && data.groups.every(g => data.marks[d.id + ':' + g.id] === 'done');
    if (d.date === t && !all) { expect = addDays(t, -1); continue; }
    if (expect === t && d.date !== t) expect = addDays(t, -1);
    if (d.date !== expect || !all) break;
    streak++;
    expect = addDays(d.date, -1);
  }
  // Rounded down, so 79.5% shows 79% and does not count as reaching an 80% goal.
  const pct = total ? Math.floor(done / total * 100) : 0;
  renderGoal(pct, total);
  $('stats').innerHTML =
    `<div class="stat"><b>${done}</b><span>Done this month</span></div>
     <div class="stat"><b>${pct}%</b><span>Month done rate</span></div>
     <div class="stat"><b>${streak}</b><span>Day streak</span></div>`;
}

/* ---------- Goal: 80% month done rate ---------- */
const GOAL = 80;
function goalColor(pct) {

}
function renderGoal(pct, total) {
  const r = 32, len = 2 * Math.PI * r, part = Math.min(pct / GOAL, 1);
  const color = goalColor(pct);
  const msg = !total ? 'Mark boxes on your chart to see your progress.'
    : pct >= GOAL ? 'Goal reached this month! 🎉'
    : `${GOAL - pct}% to go to reach your goal.`;
  const el = $('goal');
  el.setAttribute('aria-label', `Goal ${GOAL}% month done rate. You are at ${pct}%.`);
  el.innerHTML = `<div class="ring"><svg viewBox="0 0 76 76" aria-hidden="true">
      <circle class="track" cx="38" cy="38" r="${r}"/>
      <circle class="bar" cx="38" cy="38" r="${r}" stroke="${color}" stroke-dasharray="${len}" stroke-dashoffset="${len * (1 - part)}"/>
    </svg><b>${pct}%</b></div>
    <div><h2>Goal: ${GOAL}% done this month</h2><p>${msg}</p></div>`;
}

function renderToday() {
  const t = todayISO();
  const idx = data.days.findIndex(d => d.date === t);
  const el = $('todayCard');
  if (idx < 0) { el.innerHTML = `<h2>Today</h2><p class="hint">Today is not on your chart. Add this month with the "+ Add" button.</p>`; return; }
  const day = data.days[idx];
  let h = `<h2>Today: ${longDate(t)}</h2>`;
  data.groups.forEach(g => {
    const m = data.marks[day.id + ':' + g.id];
    h += `<p style="margin:12px 0 0"><b>${esc(g.name)}</b> ${m === 'done' ? '<span style="color:var(--done)">✓ done</span>' : m === 'skip' ? '<span style="color:var(--skip)">✗ missed</span>' : ''}</p>`;
    h += '<ul class="today-list">' + g.exercises.map(e => `<li>${esc(e)}</li>`).join('') + '</ul>';
  });
  el.innerHTML = h;
}

function renderGroups() {
  const wrap = $('groups');
  wrap.innerHTML = '';
  data.groups.forEach((g, gi) => {
    const c = document.createElement('div');
    c.className = 'card';
    c.innerHTML = `
      <div class="group-title">
        <input type="text" id="gname-${esc(g.id)}" value="${esc(g.name)}" aria-label="Body part name">
        <button class="small" data-act="up" aria-label="Move up">↑</button>
        <button class="small danger" data-act="del">Delete</button>
      </div>
      <div class="ex"></div>
      <div class="row"><input type="text" id="gnew-${esc(g.id)}" placeholder="New exercise (e.g. Curls 30 lb)"><button class="small primary" data-act="add">Add</button></div>`;
    const nameInput = c.querySelector('.group-title input');
    nameInput.onchange = () => { g.name = nameInput.value.trim() || g.name; save(); };
    c.querySelector('[data-act=up]').onclick = () => {
      if (gi === 0) return;
      [data.groups[gi - 1], data.groups[gi]] = [data.groups[gi], data.groups[gi - 1]];
      save();
    };
    c.querySelector('[data-act=del]').onclick = async () => {
      if (!await confirmBox(`Delete "${g.name}" and all its marks?`)) return;
      // Find it again by id: a sync may have changed the list while the question was open.
      const at = data.groups.findIndex(x => x.id === g.id);
      if (at < 0) return;
      data.groups.splice(at, 1);
      for (const k in data.marks) if (k.endsWith(':' + g.id)) delete data.marks[k];
      save();
    };
    const ex = c.querySelector('.ex');
    g.exercises.forEach((e, ei) => {
      const r = document.createElement('div');
      r.className = 'row';
      r.innerHTML = `<input type="text" id="ex-${esc(g.id)}-${ei}" value="${esc(e)}" aria-label="Exercise"><button class="small danger" aria-label="Remove exercise">✕</button>`;
      r.querySelector('input').onchange = ev => { g.exercises[ei] = ev.target.value; save(); };
      r.querySelector('button').onclick = () => { g.exercises.splice(ei, 1); save(); };
      ex.appendChild(r);
    });
    const newInput = c.querySelector('.row:last-child input');
    const add = () => { const v = newInput.value.trim(); if (v) { g.exercises.push(v); save(); } };
    c.querySelector('[data-act=add]').onclick = add;
    newInput.onkeydown = e => { if (e.key === 'Enter') add(); };
    wrap.appendChild(c);
  });
}

};

$('exportBtn').onclick = async () => {
  const filename = `workouts-backup-${todayISO()}.json`;
  const json = JSON.stringify(data, null, 2);
  let dl = null;
  try { dl = window.claude?.use ? await window.claude.use('downloads') : null; } catch {}

    try { await dl.save({ filename, data: json }); setStatus('Backup saved.'); }
    catch { setStatus('Backup was not saved.'); }
    return;
  }

function disarm(b){if(b.dataset.armed){delete b.dataset.armed;b.innerHTML=b.dataset.orig}}

/* ---------- upcoming ---------- */
function upcoming(days=45){
  const out=[];
  for(const e of S.entries){const A=AREAS[e.area]; if(!A||!live(e)||!isVis(e.area)||!isOpen(e)) continue;
    for(const [k,l] of A.dates) if(e[k]){const d=until(e[k]); if(d<=days&&d>=-30) out.push({date:e[k],title:`${l}: ${e.title}`,area:e.area,sub:e.sub||A.label,id:e.id});}}
  for(const t of S.tasks) if(!t.done&&t.due&&AREAS[t.area]&&isVis(t.area)&&until(t.due)<=days) out.push({date:t.due,title:t.title,area:t.area,sub:"Step"});
  return out.sort((a,b)=>a.date.localeCompare(b.date));
}

function bgFiltered(){
  const b=S.bg, q=b.q.trim().toLowerCase();

async function backupZip(){
  if(!S.dl){toast("Downloads aren't available in this view.");return}
  if(!window.JSZip){toast("The backup tool didn't load. Reload the page and try again.");return}
  if(Object.values(S.loaded).some(v=>!v)){toast("Still loading your data. Try again in a moment.");return}
  if(S.bk&&S.bk.busy) return;
  S.bk={busy:true,progress:"Starting backup…"}; render();
  const setP=t=>{S.bk.progress=t;const n=$("#bk-progress");if(n)n.textContent=t};
  try{
    const zip=new JSZip(); const data=exportData(); const missing=[];
    for(let i=0;i<data.files.length;i++){
      const f=data.files[i]; setP(`Adding file ${i+1} of ${data.files.length}…`);
      try{ const r=await fetch("_blob/"+encodeURIComponent(f.assetId)); if(!r.ok) throw new Error(String(r.status));
        const path=`files/${f.id}-${safeName(f.name)}`; zip.file(path,await r.blob()); f.zipPath=path }
      catch{ missing.push(f.name||"a file") }
    }
    zip.file("fresh-start.json",JSON.stringify(data,null,2));
    zip.file("README.txt","Fresh Start backup\n\nfresh-start.json holds all your data: jobs and schools, steps, waiting-on items, pinned links, file records, background check companies and settings.\nThe files folder holds your uploaded documents. Each file record's zipPath points to its copy.\n\nTo restore: open Fresh Start, go to Settings, and choose Restore from backup.\n");
    setP("Packing the backup…");
    const blob=await zip.generateAsync({type:"blob"});
    setP("Waiting for you to save it…");
    const r=await S.dl.save({filename:`fresh-start-backup-${todayISO()}.zip`,data:blob});
    S.bk={result:(r&&r.status==="saved"?"Backup saved.":"Backup ready.")+(missing.length?` ${missing.length} file${missing.length===1?"":"s"} couldn't be added: ${missing.join(", ")}.`:` It has ${data.files.length} file${data.files.length===1?"":"s"} in it.`)};
  }catch(e){
    const c=e&&e.code;
    S.bk=c==="declined"?null:{error:c==="extension_not_enabled"||c==="rejected_extension"?"Zip downloads aren't available here.":c==="rate_limited"?"A save prompt is already open.":"Couldn't make the backup. Try again."};
  }
  render();
}
const IMPORT_MAP=[["entries","entries","jobs and schools"],["steps","tasks","steps"],["waitingOn","waiting","waiting-on items"],["pinnedLinks","links","pinned links"],["files","files","files"]];
const okId=s=>typeof s==="string"&&/^[A-Za-z0-9_\-.~:@+]{1,200}$/.test(s)&&s!=="."&&s!=="..";
const friendly=m=>{const e=new Error(m);e.friendly=true;return e};
function parseImport(text){
  let d; try{d=JSON.parse(text)}catch{throw friendly("The data inside that backup isn't readable.")}
  if(!d||typeof d!=="object"||d.app!=="Fresh Start") throw friendly("That file isn't a Fresh Start backup.");
  if((d.formatVersion||0)>2) throw friendly("That backup was made by a newer version of Fresh Start.");
  const obj=x=>x&&typeof x==="object"&&!Array.isArray(x);
  const plan={};
  for(const [key,col] of IMPORT_MAP){ plan[col]=(Array.isArray(d[key])?d[key]:[]).filter(obj) }
  const bg=d.backgroundChecks||{};
  plan.companies=(Array.isArray(bg.companies)?bg.companies:[]).filter(obj);
  plan.rounds=obj(bg.rounds)?bg.rounds:null;
  plan.settings=obj(d.settings)?d.settings:null;
  plan.exportedAt=typeof d.exportedAt==="string"?d.exportedAt:"";
  return plan;
}
async function pickRestore(file){
  if(!window.JSZip){S.imp={error:"The backup tool didn't load. Reload the page and try again."};render();return}
  try{
    const zip=await JSZip.loadAsync(file); const j=zip.file("fresh-start.json");
    if(!j) throw friendly("That zip isn't a Fresh Start backup. There's no fresh-start.json inside.");
    const plan=parseImport(await j.async("string")); plan.zip=zip;
    plan.fileCount=plan.files.filter(f=>f.zipPath&&zip.file(f.zipPath)).length;
    S.imp={name:file.name,plan,mode:"merge"};
  }catch(e){ S.imp={error:e&&e.friendly?e.message:"That file isn't a Fresh Start backup (.zip)."} }
  render();
}
const COL_STATE={entries:"entries",tasks:"tasks",waiting:"waiting",links:"links",companies:"companies"};
async function runImport(){
  const P=S.imp&&S.imp.plan; if(!P||!S.db||S.imp.busy) return;
  const replace=S.imp.mode==="replace";
  const keep={files:new Set()}, writes=[], skipped=[];
  for(const col of Object.keys(COL_STATE)){
    keep[col]=new Set();
    for(const item of P[col]){
      const data={...item}; const id=okId(data.id)?data.id:null; delete data.id; delete data._raw;
      if(id) keep[col].add(id); writes.push({col,id,data});
    }
  }
  const total=P.files.length+writes.length+(P.rounds?1:0)+(P.settings?1:0); let done=0, failed=0;
  S.imp.busy=true; S.imp.progress=`Restoring 0 of ${total}…`; render();
  const tick=()=>{done++; S.imp.progress=`Restoring ${done} of ${total}…`; const n=$("#imp-progress"); if(n) n.textContent=S.imp.progress};
  // files first: re-upload any that aren't already here
  for(const item of P.files){
    const data={...item}; const id=okId(data.id)?data.id:null; const zp=data.zipPath;
    delete data.id; delete data._raw; delete data.blobPath; delete data.zipPath;
    // Already here: the same record with the same stored file, or with the same name and size
    // (a backup that was loaded before gets a new stored file id). Do not upload it again.
    const same=id&&S.files.find(f=>f.id===id&&(f.assetId===data.assetId||(f.assetId&&f.name===data.name&&f.size===data.size)));
    if(same) data.assetId=same.assetId;
    if(!same){
      const zf=zp&&P.zip&&P.zip.file(zp);
      if(!zf||!S.assets){ skipped.push(data.name||"a file"); tick(); continue }
      try{
        const blob=await zf.async("blob"); const ext=String(data.name||"").split(".").pop().toLowerCase();
        const r=await S.assets.upload(blob,{type:data.contentType||EXT[ext]});
        data.assetId=r.id; data.contentType=r.contentType; data.size=r.sizeBytes;
      }catch{ skipped.push(data.name||"a file"); tick(); continue }
    }
    try{ if(id){ await S.db.doc("files/"+id).set(data); keep.files.add(id) } else { const ref=await S.db.collection("files").add(data); if(ref&&ref.id) keep.files.add(ref.id) } }catch{ failed++ }
    tick();
  }
  for(const w of writes){ try{ if(w.id) await S.db.doc(`${w.col}/${w.id}`).set(w.data); else { const ref=await S.db.collection(w.col).add(w.data); if(ref&&ref.id) keep[w.col].add(ref.id) } }catch(e){ failed++; if(e&&(e.code==="invalid_argument"||e.code==="quota_exceeded")&&failed===1) writeErr(e) } tick() }
  if(P.rounds){ try{ await S.db.doc("meta/rounds").set(P.rounds) }catch{ failed++ } tick() }
  if(P.settings){ try{ await S.db.doc("meta/settings").set(P.settings) }catch{ failed++ } tick() }
  let removed=0;
  if(replace){
    for(const col of Object.keys(COL_STATE)) for(const cur of S[COL_STATE[col]]) if(!keep[col].has(cur.id)){ try{ await S.db.doc(`${col}/${cur.id}`).delete(); removed++ }catch{ failed++ } }
    const gone=S.files.filter(f=>!keep.files.has(f.id)); if(gone.length&&await removeFiles(gone)) removed+=gone.length;
  }
  const okN=Math.max(0,done-skipped.length-failed);
  const parts=[`Restore finished. ${okN} item${okN===1?"":"s"} saved`];
  if(removed) parts.push(`${removed} removed`);
  let msg=parts.join(", ")+".";
  if(skipped.length) msg+=` ${skipped.length} file${skipped.length===1?"":"s"} couldn't be brought back: ${skipped.join(", ")}.`;
  if(failed) msg+=` ${failed} item${failed===1?"":"s"} didn't save. Try restoring again.`;
  S.imp={result:msg}; render(); refreshUsage(); toast(failed||skipped.length?"Restore finished with problems":"Restore finished");
}

/* ---------- job link autofill ---------- */
let afLast="", afBusy=false, afT;
function companyFromUrl(u){
  let m; try{ const x=new URL(u); const h=x.hostname, p=x.pathname.split("/").filter(Boolean);
    if(/greenhouse\.io$/.test(h)&&p[0]) m=p[0]==="embed"?x.searchParams.get("for"):p[0];
    else if(h==="jobs.lever.co"||h==="jobs.ashbyhq.com"||h==="jobs.smartrecruiters.com"||h==="apply.workable.com") m=p[0];
    else if(/\.myworkdayjobs\.com$/.test(h)) m=h.split(".")[0];
    else if(/\.bamboohr\.com$/.test(h)||/\.recruitee\.com$/.test(h)) m=h.split(".")[0];
  }catch{}
  if(!m) return "";
  return m.replace(/[-_]+/g," ").replace(/\b\w/g,c=>c.toUpperCase());
}
function linkChanged(auto){
  const el=$("#f-link"); if(!el||!D||D.area!=="work") return;
  const url=safeUrl(el.value); if(!url||!host(url)) return;
  const st=$("#f-status"); if(st&&st.value==="Saved") st.value="Applied";
  const ap=$("#f-applied"); if(ap&&!ap.value) ap.value=todayISO();
  if(auto&&url!==afLast&&(!$("#f-title").value.trim()||!$("#f-sub").value.trim())) autofill();
}
function afErr(e){
  const c=e&&e.code;
  if(c==="needs_reauth") return "Your Firecrawl connection needs reconnecting in claude.ai Settings → Connectors.";
  if(c==="server_not_connected"||c==="selection_required") return "Add Firecrawl in claude.ai Settings → Connectors to use autofill.";
  if(c==="not_in_manifest"||c==="approval_required"||c==="consent_required") return "Autofill needs your OK to use Firecrawl. Tap Fill in from link to be asked again.";
  if(c==="tool_error") return "Firecrawl couldn't read that page. Some job sites block it, so fill in the details yourself.";
  if(c==="server_unavailable"||c==="rate_limited") return "Firecrawl didn't answer. Try again in a minute.";
  return "Autofill didn't work this time. Fill in the details yourself.";
}
async function autofill(){
  const el=$("#f-link"), note=$("#af-note"), btn=$("#af-btn"); if(!el||!note) return;
  const url=safeUrl(el.value); if(!url||!host(url)){note.textContent="Paste the job posting's link first.";el.focus();return}
  const guess=companyFromUrl(url); const t=$("#f-title"); if(guess&&!t.value.trim()) t.value=guess;
  if(!S.mcp){note.textContent=guess?`Filled in the company (${guess}) from the link. Reading the full posting needs your Firecrawl connection.`:"Reading the posting needs your Firecrawl connection.";return}
  if(afBusy) return; afBusy=true; afLast=url; if(btn) btn.disabled=true; note.textContent="Reading the posting…";
  const id=D&&D.id;
  try{
    const r=await S.mcp.callTool("Firecrawl","firecrawl_scrape",{url,objective:"Fill in a personal job application tracker with this posting's company, title and pay.",formats:["json"],onlyMainContent:true,
      jsonOptions:{prompt:"Extract the hiring company name, the job title, and the pay and hours (e.g. '$18/hr, 20 hrs/wk' or 'Part-time, $40k-$50k'). Use empty strings when not stated.",
        schema:{type:"object",properties:{company:{type:"string"},title:{type:"string"},pay:{type:"string"}},required:["company","title","pay"]}}});
    if(!D||D.id!==id) return;
    const p=r&&r.payload; const j=p&&typeof p==="object"?(p.json||(p.data&&p.data.json)||(("company" in p)?p:null)):null;
    if(!j){note.textContent="Couldn't find job details on that page. Fill them in yourself.";return}
    const filled=[];
    const put=(k,v,label)=>{const i=$("#f-"+k); v=typeof v==="string"?v.trim():""; if(i&&v&&!i.value.trim()){i.value=v.slice(0,400);filled.push(label)}};
    put("title",j.company,"company"); put("sub",j.title,"job title"); put("pay",j.pay,"pay");
    const words=filled.length>1?filled.slice(0,-1).join(", ")+" and "+filled[filled.length-1]:filled[0];
    note.textContent=filled.length?`Filled in ${words}. Check them before you save.`:"Nothing new to fill in. Those fields already had something in them.";
  }catch(e){ note.textContent=afErr(e) }
  finally{ afBusy=false; if(btn) btn.disabled=false }
}

/* ---------- uploads ---------- */
let pickCtx=null;
async function uploadFiles(fileList,{area,entryId,key}){
  if(!S.assets||!S.db){toast("Uploading isn't available in this view.");return}
  const label=document.getElementById("dt-"+key)?.value||"Other";
  let n=0;
  for(const file of fileList){
    const ext=(file.name.split(".").pop()||"").toLowerCase(); const type=EXT[ext];
    if(!type){toast(`${file.name} can't be uploaded. Save it as a PDF, JPG or PNG first.`);continue}
    if(file.size>20*1048576){toast(`${file.name} is too big. Files can be up to 20 MB.`);continue}
    if(!file.size){toast(`${file.name} is empty.`);continue}
    toast(`Uploading ${file.name}…`);
    try{
      const r=await S.assets.upload(file,{type});
      await S.db.collection("files").add({area,entryId:entryId||"",label,name:file.name,assetId:r.id,contentType:r.contentType,size:r.sizeBytes,createdAt:Date.now()});
      n++;
    }catch(e){ if(e&&e.code&&["invalid_argument","quota_exceeded"].includes(e.code)) writeErr(e); else uploadErr(e,file.name) }
  }
  if(n) toast(n===1?"File uploaded":`${n} files uploaded`);
  refreshUsage();
}

    const f=S.files.find(x=>x.id===el.dataset.id); if(f&&await removeFiles([f])){toast("File deleted");refreshUsage()} }

    a += sweep;
    return `<path d="${d}" fill="${x.color}" fill-rule="evenodd" data-tip="${tip}"></path>`;
  }).join('');
  const key = centerLabel + '|' + emptyText;
  const legend = list.map(x => x.rest

  return `<div class="donutwrap"><svg class="donut" viewBox="0 0 168 168" role="img" aria-label="${esc(centerLabel)} ${esc(fmt(total))}">${paths}
    <text class="c1" x="84" y="78" text-anchor="middle">${esc(centerLabel)}</text><text class="c2" x="84" y="100" text-anchor="middle">${esc(fmtShort(total))}</text></svg>
    <div class="legend">${legend}</div></div>`;
}

/* ---------- Excel (.xlsx) import ----------
   Built around a "running bill sheet": a header row with Due Date / Creditor / amount / Jan…Dec,
   income lines above it (name + amount), "Paid" (or an amount) in a month cell when that month was paid,
   "-" / "N/A" when nothing was due, and cell notes with the details. Hidden sheets are skipped. */
const MONTHS = ['jan', 'feb', 'mar', 'apr', 'may', 'jun', 'jul', 'aug', 'sep', 'oct', 'nov', 'dec'];
const XNS = 'http://schemas.openxmlformats.org/spreadsheetml/2006/main';
const RNS = 'http://schemas.openxmlformats.org/officeDocument/2006/relationships';
const colNum = ref => { let n = 0; for (const ch of ref.replace(/\d+$/, '')) n = n * 26 + ch.charCodeAt(0) - 64; return n; };
const kids = (el, name) => el ? Array.from(el.getElementsByTagNameNS(XNS, name)) : [];
const textOf = el => kids(el, 't').map(t => t.textContent).join('');
const xmlDoc = s => { const d = new DOMParser().parseFromString(s, 'application/xml'); if (d.getElementsByTagName('parsererror').length) throw new Error('bad xml'); return d; };

function renderNotes() {
  const q = $('noteSearch').value.trim();
  const hit = (...parts) => !q || parts.some(p => String(p || '').toLowerCase().includes(q.toLowerCase()));
  const mine = [...data.notes].sort((a, b) => b.updated.localeCompare(a.updated)).filter(n => hit(n.title, n.text));
  $('ntMine').innerHTML = mine.length ? mine.map(n => `<div class="row"><div class="main"><div class="name">${hl(n.title || 'Note', q)}</div>
    <div class="meta">Updated ${niceDate(n.updated)}</div><div class="ntext">${hl(n.text, q)}</div></div>
    <div class="acts"><button type="button" class="small" data-act="editnote" data-id="${n.id}">Edit</button><button type="button" class="small danger" data-act="delnote" data-id="${n.id}">Delete</button></div></div>`).join('')
    : empty(q ? 'No matches in your notes.' : 'Nothing yet. Add reminders, account phone numbers, payment plans, anything.');
  const bills = data.bills.filter(b => b.note && hit(b.name, b.note)).sort((a, b) => a.name.localeCompare(b.name));
  $('ntBills').innerHTML = bills.length ? bills.map(b => `<div class="row"><div class="main"><div class="name">${hl(b.name, q)}</div>
    <div class="meta">${fmt(b.amount)} · ${esc(FREQS[b.freq])}${b.freq === 'monthly' ? ' · due the ' + dueDay(b) + ordinal(dueDay(b)) : ''}</div>
    <div class="ntext">${hl(b.note, q)}</div></div>
    <div class="acts"><button type="button" class="small" data-act="billnote" data-id="${b.id}">Edit note</button><button type="button" class="small danger" data-act="delbillnote" data-id="${b.id}">Delete note</button></div></div>`).join('')
    : empty(q ? 'No matches in bill notes.' : 'No bill has a note yet. Add one with Edit note or the bill\'s Edit button.');
  const inc = data.income.filter(x => x.note && hit(x.name, x.note));
  $('ntIncome').innerHTML = inc.length ? inc.map(x => `<div class="row"><div class="main"><div class="name">${hl(x.name, q)}</div><div class="meta">${fmt(x.amount)} a month</div>
    <div class="ntext">${hl(x.note, q)}</div></div><div class="acts"><button type="button" class="small" data-act="editincome" data-id="${x.id}">Edit</button><button type="button" class="small danger" data-act="delincnote" data-id="${x.id}">Delete note</button></div></div>`).join('')
    : empty(q ? 'No matches in income notes.' : 'No income notes.');
}
$('noteSearch').addEventListener('input', () => { if (view === 'notes') renderNotes(); });
function noteForm(n) {
  const isNew = !n; n = n || { title: '', text: '' };
  openForm(isNew ? 'Add note' : 'Edit note', `
    <label>Title</label><input name="title" maxlength="80" value="${esc(n.title)}" placeholder="e.g., Credit One payment plan">
    <label>Note</label><textarea name="text" maxlength="8000" rows="9" required>${esc(n.text)}</textarea>`, v => {
    if (!isNew && !(n = refind('notes', n))) return 'This was removed on another device.';
    const t = { title: str(v.title, 80).trim(), text: str(v.text, 8000), updated: today() };
    if (!t.text.trim() && !t.title) return 'Type a note first.';
    if (isNew) data.notes.push({ id: uid(), ...t }); else Object.assign(n, t);
  }, isNew ? {} : { onDelete: () => { data.notes = data.notes.filter(x => x.id !== n.id); }, deleteAsk: 'Delete this note?' });
}
function addBillNoteForm() {
  if (!data.bills.length) { alert('Add a bill first.'); return; }
  const opts = [...data.bills].sort((a, b) => a.name.localeCompare(b.name)).map(b => `<option value="${b.id}">${esc(b.name)}${b.note ? ' (has a note)' : ''}</option>`).join('');
  const now = new Date();
  openForm('Add bill note', `<label>Bill</label><select name="billId">${opts}</select>
    <label>Note</label><textarea name="text" maxlength="2000" rows="5" required>${pad(now.getMonth() + 1)}/${pad(now.getDate())}/${String(now.getFullYear()).slice(2)} – </textarea>`, v => {
    const b = data.bills.find(x => x.id === v.billId);
    if (!b) return 'This bill was removed on another device.';
    const t = str(v.text, 2000).trim();
    if (!t) return 'Type a note first.';
    b.note = str(b.note ? b.note.replace(/\s+$/, '') + '\n' + t : t, 4000);
  }, { sub: 'It is added to the end of that bill\'s notes.', ok: 'Add' });
}
function billNoteForm(b) {
  openForm(`Notes · ${b.name}`, `<label>Note</label><textarea name="note" maxlength="4000" rows="12">${esc(b.note)}</textarea>`, v => {
    if (!(b = refind('bills', b))) return 'This was removed on another device.';
    b.note = str(v.note, 4000);
  }, { sub: 'Tip: start a new line with the date when you add something, like "12/01/26 – $250 paid".' });
}

/* ---------- clicks ---------- */
document.addEventListener('click', ev => {
  const t = ev.target.closest('button');
  if (!t || !document.contains(t)) return;
  if (t.dataset.view) { setView(t.dataset.view); return; }
  if (t.dataset.go) { setView(t.dataset.go); return; }
  if (t.id === 'yPrev' || t.id === 'yNext') { gridYear += t.id === 'yNext' ? 1 : -1; render(); return; }
  const busy = mode === 'loading' || (mode === 'db' && !loaded);
  if (busy && (t.id === 'importXlsx' || t.dataset.add || t.dataset.act)) { setStatus('Your saved data is still loading. Try again in a moment.'); return; }
  if (t.id === 'importXlsx') {
    $('xlsxFile').value = ''; $('xlsxFile').click(); return;
  }
  if (t.dataset.bseg) { billSeg = t.dataset.bseg; render(); return; }
  const add = t.dataset.add;
  if (add) {
    ({ bill: () => billForm(), goal: () => goalForm(), income: () => incomeForm(), note: () => noteForm(), billnote: () => addBillNoteForm() })[add]?.();
    return;
  }
  const id = t.dataset.id;
  switch (t.dataset.act) {
    case 'editbill': { const b = data.bills.find(x => x.id === id); if (b) billForm(b); break; }
    case 'delbill': { const b = data.bills.find(x => x.id === id); if (b && confirm(`Delete the bill ${b.name}? Its payment history goes too.`)) { deleteBill(id); save(); } break; }
    case 'paybill': { const b = data.bills.find(x => x.id === id); if (b) payBillForm(b, t.dataset.due); break; }
    case 'editgoal': { const g = data.goals.find(x => x.id === id); if (g) goalForm(g); break; }
    case 'goaladd': { const g = data.goals.find(x => x.id === id); if (g) goalAddForm(g); break; }
    case 'posted': { const e = data.log.find(x => x.id === id); if (e) { e.pending = false; save(); } break; }
    case 'cell': cellTap(id, t.dataset.due); break;
    case 'editnote': { const x = data.notes.find(y => y.id === id); if (x) noteForm(x); break; }
    case 'delnote': { const x = data.notes.find(y => y.id === id); if (x && confirm(`Delete the note "${x.title || 'Note'}"?`)) { data.notes = data.notes.filter(y => y.id !== id); save(); } break; }
    case 'delbillnote': { const b = data.bills.find(x => x.id === id); if (b && confirm(`Delete the whole note on ${b.name}? The bill itself stays.`)) { b.note = ''; save(); } break; }
    case 'delincnote': { const x = data.income.find(y => y.id === id); if (x && confirm(`Delete the note on ${x.name}? The income line stays.`)) { x.note = ''; save(); } break; }
    case 'billnote': { const b = data.bills.find(x => x.id === id); if (b) billNoteForm(b); break; }
    case 'editincome': { const x = data.income.find(y => y.id === id); if (x) incomeForm(x); break; }
  }
});

render();
start();

;

HUB_EXPORT({
  ready: () => mode === "local" || (mode === "db" && loaded),
  matches: d => !!d && d.app === "money",
  exportData: () => JSON.parse(JSON.stringify(data)),
  peek: () => data,
  importData: async d => {
    if (mode === "db" && !loaded) throw new Error("Money is still loading.");
    if (mode === "none") throw new Error("Money's saved data could not be read on this device.");
    if (mode === "db" && !canWrite) throw new Error("You can view Money but not change it.");
    data = clean(d); save();
    if (saveTimer) { clearTimeout(saveTimer); await flush(); }
    if (mode === "db" && dirty) throw new Error("Money did not save yet. It will keep trying while the app stays open.");
    return `${data.bills.length} bills, ${data.goals.length} goals, ${data.notes.length} notes`;
  },
});

});
</script>

<script>HUB.start();</script>


</body></html>
